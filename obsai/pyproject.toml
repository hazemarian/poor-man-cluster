[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nextrum-obsai"
version = "0.1.0"
description = "Evidence-only observability companion for Nextrum"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
obsai = "obsai.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
