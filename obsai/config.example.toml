# Reference settings only: this initial service reads OBSAI_* environment
# variables, not TOML files. See README.md for supported environment settings.
# Secrets are supplied through the environment; this file contains none.

[server]
bind_host = "127.0.0.1"
bind_port = 8080

[parseable]
url = "http://127.0.0.1:8000"
stream = "pmcluster-logs"
# auth_header = "Basic <base64>"  # prefer OBSAI_PARSEABLE_AUTH_HEADER

[limits]
max_rows = 50000
max_templates = 150
max_exemplar_chars = 500
default_window_hours = 2
max_window_hours = 24
