app: horizon-erp
env: production
domain: nextrum-sy.com
registry: ghcr.io/nextrum-sy
version: v20260909-0be76af

services:
  web:
    image: ghcr.io/nextrum-sy/simple-erp:${version}
    placement: manager
    replicas: 1

    expose:
      port: 8080
      host: horizon-erp.${domain}

    volumes:
      - horizon-erp-data:/app/data

    env:
      PORT: "8080"
      DB_PATH: /app/data/erp.db
      APP_ENV: production
      SESSION_SECRET: "horizon-erp-production-secret-change-me"
      COOKIE_SECURE: "true"
      LANGUAGES: "en,ar"
      DEFAULT_LANGUAGE: "en"
      CURRENCY: "USD"
      EXPENSE_TYPES: "rent,utilities,office_supplies,travel,marketing,legal,insurance,maintenance,software,other"
      ADMIN_USER: "admin"
      ADMIN_PASSWORD: "Admin@123!"
      OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector:4317"
      OTEL_SERVICE_NAME: "horizon-erp"

    healthcheck:
      type: http
      path: /health
# test: v0.2.10 auto-prune + transform/metrics
