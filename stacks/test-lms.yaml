# Test tenant: uses the seeded database already provisioned in the
# lms-test-data volume.
app: test-lms
env: production
domain: nextrum-sy.com
registry: ghcr.io/nextrum-sy
version: v20260919-f70bc09

services:
  web:
    image: ${registry}/simple-lms:${version}
    placement: manager
    replicas: 1

    expose:
      port: 8080
      host: test-lms.${domain}

    volumes:
      - lms-test-data:/app/data
      - lms-test-backups:/backups

    env:
      PORT: ":8080"
      DATA_DIR: /app/data
      DB_PATH: /app/data/lms.db
      GIN_MODE: release
      SESSION_SECRET: "87172f04c51bd607fc24033113edcbef5e8ae646443292e305dcfc9ad43b19ff"
      PUBLIC_URL: "https://test-lms.nextrum-sy.com"
      LANGS: "en,ar"
      SUPPORTED_CURRENCIES: "USD,SYP,TRY,EUR"
      ADMIN_USER: "admin"
      ADMIN_PASSWORD: "mdsAbZ9qnHGrzLg9bGw3"
      # Set to the swarm ingress subnet/CIDR when known; empty = trust none.
      TRUSTED_PROXIES: ""
      OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector:4317"
      OTEL_SERVICE_NAME: "test-lms"

    healthcheck:
      type: http
      path: /health
