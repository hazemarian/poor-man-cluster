app: property-management
env: production
domain: nextrum-sy.com
registry: ghcr.io/nextrum-sy
version: v20260916-40a4e27

services:
  web:
    image: ${registry}/property-management:${version}
    placement: manager
    replicas: 1

    expose:
      port: 8080
      host: property-management.${domain}

    volumes:
      - property-management-data:/data

    env:
      PORT: "8080"
      DB_PATH: /data/app.db
      LANGS: "en,ar"
      LOG_LEVEL: info
      FORCE_CHANGE_PASS: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector:4318"
      OTEL_SERVICE_NAME: "property-management"

    healthcheck:
      type: http
      path: /health
# test: v0.2.10 auto-prune + transform/metrics
