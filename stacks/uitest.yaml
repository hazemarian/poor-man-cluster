app: uitest
env: production
domain: nextrum-sy.com
services:
  web:
    image: nginx:alpine
    placement: manager
    command:
      - sh
      - -c
      - "printenv | sort > /usr/share/nginx/html/env.txt; exec nginx -g 'daemon off;'"
    env:
      ENV_CFG: config(uitest_env_cfg)
      FILE_CFG: config(uitest_file_cfg)
      TPL_CFG: config(uitest_tpl_cfg)
      DB_PASS: secrets(uitest_db_pass)
    secrets:
      - uitest_db_pass
    expose:
      port: 80
      host: uitest.nextrum-sy.com
