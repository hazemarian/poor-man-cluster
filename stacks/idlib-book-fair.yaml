app: idlib-book-fair
env: production
domain: nextrum-sy.com
registry: ghcr.io/nextrum-sy
version: v20260914-8facb64

services:
  web:
    image: ghcr.io/nextrum-sy/idlib-book-fair:${version}
    placement: manager
    replicas: 1

    expose:
      port: 3000
      host: idlib-book-fair.${domain}
      aliases:
        - www.idlebbookfair.com

    env:
      # PORT/NODE_ENV are what the standalone runner listens on.
      PORT: "3000"
      NODE_ENV: "production"
      NEXT_PUBLIC_SITE_URL: "https://idlib-book-fair.${domain}"

    healthcheck:
      type: http
      path: /
