# Opt-in: publish the collector's OTLP receivers on loopback so applications on
# this host can send traces, logs and metrics to http://127.0.0.1:4318.
#
#   docker compose -f compose.yaml -f compose.otlp.yaml up -d
#
# Not part of the default stack: a host that also runs the Swarm collector
# already owns 4318, and the two would clash.
services:
  collector:
    ports: ['127.0.0.1:4317:4317', '127.0.0.1:4318:4318']
