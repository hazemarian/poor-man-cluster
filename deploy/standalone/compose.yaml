name: nextrum-monitoring
services:
  parseable:
    image: parseable/parseable:v2.8.0
    command: [/usr/bin/parseable, local-store]
    # Keep this stable across container recreation; Parseable uses it in
    # per-day manifest filenames. Existing installs must set it to the
    # original hostname recorded by their first manifest before upgrading.
    hostname: ${PARSEABLE_HOSTNAME:?required}
    environment:
      P_ADDR: 0.0.0.0:8000
      P_USERNAME: monitoring
      P_PASSWORD: ${PARSEABLE_PASSWORD:?required}
      P_FS_DIR: /data
      P_STAGING_DIR: /staging
      P_SEND_ANONYMOUS_USAGE_DATA: 'false'
      P_CHECK_UPDATE: 'false'
    volumes: [parseable-data:/data, parseable-staging:/staging]
    mem_limit: 768m
    cpus: 0.5
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options: {max-size: 5m, max-file: '2'}
  collector:
    image: otel/opentelemetry-collector-contrib:0.157.0
    user: '0:0'
    command: [--config=/etc/otel.yaml]
    environment:
      HOST_NAME: ${HOST_NAME:?required}
      HOST_PROC: /hostfs/proc
      HOST_SYS: /hostfs/sys
      PARSEABLE_AUTH: ${PARSEABLE_AUTH:?required}
    volumes:
      - ./otel.yaml:/etc/otel.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/hostfs/proc:ro
      - /sys:/hostfs/sys:ro
      - collector-offsets:/var/lib/otel
    mem_limit: 256m
    cpus: 0.3
    restart: unless-stopped
    logging: *logging
  daemon:
    image: nextrum-pmcluster:standalone
    command: [observe]
    environment:
      PMCLUSTER_DATA_DIR: /data
      PMCLUSTER_LISTEN_ADDR: 0.0.0.0:9090
      PMCLUSTER_OBSERVE_TOKEN: ${DAEMON_TOKEN:?required}
      PMCLUSTER_OTLP_ENDPOINT: ''
      GOMEMLIMIT: 400MiB
    volumes: [daemon-data:/data, /var/run/docker.sock:/var/run/docker.sock:ro]
    mem_limit: 512m
    cpus: 0.75
    restart: unless-stopped
    logging: *logging
  edge:
    image: nextrum-pmcluster:standalone
    entrypoint: [/usr/local/bin/edge]
    environment:
      LISTEN_ADDR: 0.0.0.0:8042
      UPSTREAM: http://daemon:9090
      EDGE_LOGIN_DISABLED: 'true'
      PMCLUSTER_OBSERVER_MODE: 'true'
      APP_VERSION: ${APP_VERSION:-nextrum-observer-20261017-public}
      PMCLUSTER_API_TOKEN: ${DAEMON_TOKEN:?required}
      OBSERVABILITY_PARSEABLE_URL: http://parseable:8000
      OBSERVABILITY_PARSEABLE_AUTH: ${PARSEABLE_AUTH:?required}
      PMCLUSTER_PUBLIC_ORIGIN: ${CONSOLE_ORIGIN:-http://localhost:18042}
      GOMEMLIMIT: 160MiB
    ports: [127.0.0.1:18042:8042]
    mem_limit: 192m
    cpus: 0.5
    restart: unless-stopped
    logging: *logging
volumes:
  parseable-data:
  parseable-staging:
  collector-offsets:
  daemon-data:
