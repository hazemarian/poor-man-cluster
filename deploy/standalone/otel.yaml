extensions:
  health_check: null
  docker_observer:
    use_hostname_if_present: true
    endpoint: unix:///var/run/docker.sock
    api_version: '1.44'
    timeout: 5s
    include_all_containers: true
  file_storage:
    directory: /var/lib/otel
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  docker_stats:
    endpoint: unix:///var/run/docker.sock
    collection_interval: 10s
    api_version: '1.44'
    container_labels_to_metric_labels:
      com.docker.compose.project: stack.name
      com.docker.compose.service: compose.service
  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      load: null
  receiver_creator:
    watch_observers:
    - docker_observer
    receivers:
      filelog/docker:
        rule: type == "container" and port == 0
        config:
          include:
          - /var/lib/docker/containers/`container_id`/*-json.log
          include_file_name: false
          include_file_path: true
          start_at: end
          operators:
          - type: json_parser
            error_mode: ignore
            timestamp:
              parse_from: attributes.time
              layout: '%Y-%m-%dT%H:%M:%S.%LZ'
            severity:
              parse_from: attributes.stream
              mapping:
                info: stdout
                error: stderr
          - type: move
            from: attributes.log
            to: body
            if: attributes.log != nil
          storage: file_storage
          max_log_size: 256KiB
        resource_attributes:
          service.name: '`(labels["com.docker.compose.project"] ?? "") != "" and (labels["com.docker.compose.service"]
            ?? "") != "" ? labels["com.docker.compose.project"] + "_" + labels["com.docker.compose.service"]
            : "standalone_" + name`'
          stack.name: '`labels["com.docker.compose.project"] ?? "standalone"`'
          container.name: '`name`'
          container.id: '`container_id`'
          container.image.name: '`image`'
          container.labels.io.pmcluster.skip_filelog: '`labels["io.pmcluster.skip_filelog"]
            ?? ""`'
processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 160
    spike_limit_mib: 32
  filter/drop_docker_api_spans:
    error_mode: ignore
    traces:
      span:
      - IsMatch(name, "^[A-Z]+ /v1\\.[0-9]+/")
  filter/skip_filelog:
    error_mode: ignore
    logs:
      log_record:
      - resource.attributes["stack.name"] == "nextrum-monitoring"
      - resource.attributes["container.labels.io.pmcluster.skip_filelog"] == "true"
  resource:
    attributes:
    - key: host.name
      action: upsert
      value: ${env:HOST_NAME}
  transform/metrics:
    metric_statements:
    - context: datapoint
      statements:
      # Keep an explicit point-level identity authoritative.  The docker_stats
      # receiver attaches compose labels to resource attributes, while OTLP
      # producers may already provide service.name on the datapoint itself.
      - set(attributes["service.name"], resource.attributes["service.name"])
        where attributes["service.name"] == nil and resource.attributes["service.name"] != nil
      # In contrib 0.157+, container_labels_to_metric_labels writes the
      # configured labels to resource attributes.  Materialize the same
      # stack_service identity on the datapoint for Parseable metric queries.
      - set(attributes["service.name"], Concat([resource.attributes["stack.name"],
        resource.attributes["compose.service"]], "_")) where attributes["service.name"] == nil
        and resource.attributes["stack.name"] != nil and resource.attributes["compose.service"] != nil
      # Retain compatibility with older/SDK paths that put compose labels on
      # the datapoint rather than on the resource.
      - set(attributes["service.name"], Concat([attributes["stack.name"], attributes["compose.service"]],
        "_")) where attributes["service.name"] == nil and attributes["stack.name"] != nil
        and attributes["compose.service"] != nil
  resourcedetection:
    detectors:
    - docker
    - system
    override: false
  batch:
    send_batch_size: 1000
    timeout: 10s
  transform/identity:
    log_statements:
    - context: log
      statements:
      - replace_pattern(resource.attributes["service.name"], "^standalone_/", "standalone_")
exporters:
  otlphttp/parseable-logs:
    logs_endpoint: http://parseable:8000/v1/logs
    encoding: json
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 60s
    sending_queue:
      enabled: true
      queue_size: 128
      num_consumers: 4
    headers:
      Authorization: ${env:PARSEABLE_AUTH}
      X-P-Stream: pmcluster-logs
      X-P-Log-Source: otel-logs
  otlphttp/parseable-metrics:
    metrics_endpoint: http://parseable:8000/v1/metrics
    encoding: json
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 60s
    sending_queue:
      enabled: true
      queue_size: 128
      num_consumers: 4
    headers:
      Authorization: ${env:PARSEABLE_AUTH}
      X-P-Stream: pmcluster-metrics
      X-P-Log-Source: otel-metrics
  otlphttp/parseable-traces:
    traces_endpoint: http://parseable:8000/v1/traces
    encoding: json
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 60s
    sending_queue:
      enabled: true
      queue_size: 128
      num_consumers: 4
    headers:
      Authorization: ${env:PARSEABLE_AUTH}
      X-P-Stream: pmcluster-traces
      X-P-Log-Source: otel-traces
service:
  extensions:
  - health_check
  - docker_observer
  - file_storage
  telemetry:
    logs:
      level: info
  pipelines:
    logs/filelog:
      receivers:
      - receiver_creator
      processors:
      - memory_limiter
      - resourcedetection
      - filter/skip_filelog
      - transform/identity
      - batch
      exporters:
      - otlphttp/parseable-logs
    logs/otlp:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - resourcedetection
      - batch
      exporters:
      - otlphttp/parseable-logs
    metrics:
      receivers:
      - docker_stats
      - hostmetrics
      - otlp
      processors:
      - memory_limiter
      - resourcedetection
      - resource
      - transform/metrics
      - batch
      exporters:
      - otlphttp/parseable-metrics
    traces:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - filter/drop_docker_api_spans
      - batch
      exporters:
      - otlphttp/parseable-traces
