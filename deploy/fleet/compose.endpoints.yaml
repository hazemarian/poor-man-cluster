# Install as compose.override.yaml on Crestline and Damarkets only. The base
# Compose file pins parseable.hostname from PARSEABLE_HOSTNAME; preserve that
# setting when installing this endpoint override.
# Deshli already has a host observer on 9090 and its own backend override.
# These listeners are for the restricted SSH fleet connections, not public use.
services:
  parseable:
    ports: ['127.0.0.1:18080:8000']
  daemon:
    ports: ['127.0.0.1:19090:9090']
