name: release

# Triggered by pushing a tag like v0.1.0 (any tag matching v*).
# Builds darwin+linux × arm64+amd64 binaries, computes SHA256 sums,
# and uploads everything to a GitHub Release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to create the release + upload artifacts
  packages: write   # needed to push pmcluster-edge to GHCR

jobs:
  release:
    name: cross-compile and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # `git describe --tags` needs full history

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: pmcluster/go.sum

      - name: Build matrix
        working-directory: pmcluster
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          PKG=github.com/hazemarian/poor-man-stack/pmcluster
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          COMMIT=$(git rev-parse --short HEAD)
          LDFLAGS="-s -w \
            -X ${PKG}/internal/buildinfo.Version=${VERSION} \
            -X ${PKG}/internal/buildinfo.Commit=${COMMIT} \
            -X ${PKG}/internal/buildinfo.Date=${DATE}"
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            GOOS=${target%/*}
            GOARCH=${target#*/}
            OUT="dist/pmcluster-${VERSION}-${GOOS}-${GOARCH}"
            echo "→ ${OUT}"
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH \
              go build -trimpath -ldflags "$LDFLAGS" -o "$OUT" ./cmd/pmcluster
            tar -C dist -czf "${OUT}.tar.gz" "$(basename "$OUT")"
            rm "$OUT"
          done
          (cd dist && shasum -a 256 *.tar.gz > SHA256SUMS.txt)
          ls -la dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pmcluster/dist/pmcluster-*.tar.gz
            pmcluster/dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true

  edge-image:
    name: build and push pmcluster-edge image
    runs-on: ubuntu-latest
    # Requires a GHCR PAT with `packages:write` (e.g. GH_Token) — skip with a
    # clear status when it's not configured rather than failing the release.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    env:
      # `secrets` can't be referenced in `if:` expressions, so expose the token's
      # presence via a job env and gate steps on env.GH_PUSH instead.
      GH_PUSH: ${{ secrets.GH_Token != '' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The pmcluster-edge image pushes to ghcr.io/nextrum-sy (not this repo's
      # namespace), so it needs a PAT (GH_Token) scoped to that org with
      # `packages:write`. Until it's configured these steps are skipped — the
      # release workflow continues to publish the cross-compiled binaries.
      - name: Log in to GHCR
        if: env.GH_PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GH_USER }}
          password: ${{ secrets.GH_Token }}

      - name: Build and push
        if: env.GH_PUSH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: pmcluster
          file: pmcluster/Dockerfile.edge
          push: true
          tags: |
            ghcr.io/nextrum-sy/pmcluster-edge:${{ github.ref_name }}
            ghcr.io/nextrum-sy/pmcluster-edge:latest

      - name: Warn about missing GHCR token
        if: env.GH_PUSH == 'false'
        run: echo "::warning::GH_Token not configured — skipping pmcluster-edge image push"
