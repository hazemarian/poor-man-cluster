name: release

# Triggered by pushing a tag like v0.1.0 (any tag matching v*).
# Builds darwin+linux × arm64+amd64 binaries, computes SHA256 sums,
# and uploads everything to a GitHub Release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to create the release + upload artifacts
  packages: write   # needed to push pmcluster-edge to GHCR

jobs:
  release:
    name: cross-compile and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # `git describe --tags` needs full history

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: pmcluster/go.sum

      - name: Build matrix
        working-directory: pmcluster
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          PKG=github.com/hazemarian/poor-man-cluster/pmcluster
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          COMMIT=$(git rev-parse --short HEAD)
          LDFLAGS="-s -w \
            -X ${PKG}/internal/buildinfo.Version=${VERSION} \
            -X ${PKG}/internal/buildinfo.Commit=${COMMIT} \
            -X ${PKG}/internal/buildinfo.Date=${DATE}"
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            GOOS=${target%/*}
            GOARCH=${target#*/}
            OUT="dist/pmcluster-${VERSION}-${GOOS}-${GOARCH}"
            echo "→ ${OUT}"
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH \
              go build -trimpath -ldflags "$LDFLAGS" -o "$OUT" ./cmd/pmcluster
            tar -C dist -czf "${OUT}.tar.gz" "$(basename "$OUT")"
            rm "$OUT"
          done
          (cd dist && shasum -a 256 *.tar.gz > SHA256SUMS.txt)
          ls -la dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pmcluster/dist/pmcluster-*.tar.gz
            pmcluster/dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true

  edge-image:
    name: build and push pmcluster-edge image
    runs-on: ubuntu-latest
    # Pushes to ghcr.io/<this repo owner>/pmcluster-edge using the built-in
    # GITHUB_TOKEN (permissions: packages: write) — no PAT required for
    # packages owned by the same account/repo.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: pmcluster
          file: pmcluster/Dockerfile.edge
          push: true
          tags: |
            ghcr.io/hazemarian/pmcluster-edge:${{ github.ref_name }}
            ghcr.io/hazemarian/pmcluster-edge:latest
