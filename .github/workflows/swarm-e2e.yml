# Real-cluster e2e — runs SEPARATELY from the main build gate.
#
# These tests boot a full Docker Swarm (cluster up, deploy pipeline, webhook,
# secrets/configs) and are slow + resource-heavy. They run on EVERY push to main
# and on every PR, and their result never blocks anything: deployments
# (release.yml on tags) and the main CI gate (pmcluster.yml: lint + build + unit
# tests + fast e2e) are independent of this workflow.
#
# Every push, not "every push that touched pmcluster/**": the path filter was
# there to save runner minutes, and it bought the wrong thing — a change to the
# workflow, a docs-only commit that also carried a code fix, or a rebase could
# leave the last green swarm run pointing at a tree nobody had run. A suite that
# is not always on is a suite whose failures are always a surprise.
name: swarm-e2e

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "pmcluster/**"
      # Documentation under pmcluster/ is not code. Without these exclusions a
      # README or design-doc edit runs the Go unit/smoke suite and the real-swarm
      # e2e, because `pmcluster/**` matches `pmcluster/README.md`,
      # `pmcluster/docs/*.md` and `internal/ARCHITECTURE.md` too. The docs
      # workflow covers those changes; this one is for behaviour.
      - "!pmcluster/*.md"
      - "!pmcluster/**/*.md"
      - ".github/workflows/swarm-e2e.yml"

# PRs still filter by path: a PR that touches nothing but docs does not need a
# swarm, and the merge to main runs the full suite anyway.

jobs:
  swarm-e2e:
    name: cluster up + deploy + webhook e2e (real swarm)
    runs-on: ubuntu-latest
    env:
      # Pin where docker stores registry credentials so the e2e harness
      # (which runs pmcluster with HOME=<temp>) can find them via
      # DOCKER_CONFIG passthrough.  Must match the login step below.
      DOCKER_CONFIG: /home/runner/.docker
    defaults:
      run:
        working-directory: pmcluster
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: pmcluster/go.sum

      # ubuntu-latest already has Docker + the docker CLI installed; no
      # privileged container needed since we run dockerd on the host.
      #
      # The edge stack references ghcr.io/hazemarian/pmcluster-edge:latest
      # (published by the release workflow), so log in to GHCR so the swarm
      # can pull it during `cluster up`.  logout: false keeps the
      # credentials around for the swarm e2e step that follows.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: false

      # The cluster up OpenObserve provisioner reaches OO over the public edge
      # (https://observ.<domain>).  In CI the domain is example.test with no
      # public DNS, so map it to localhost (Traefik listens on :443) and let
      # the provisioner skip TLS verification for the self-signed e2e cert.
      - name: Map observ.example.test to localhost
        run: echo "127.0.0.1 observ.example.test" | sudo tee -a /etc/hosts

      # cluster up creates its own paths via ensureStorageDirs and
      # ensurePlatformHostDirs — the runner is not root, so pre-create the ones a
      # test that uses the DEFAULT root would need. Tests that pass a temp
      # --volume-root create their own tree, including /var/stack/nodestat's
      # equivalent beside it: the node-stat bind source follows the volume root
      # (NodeStatHostDirFor), precisely so a non-root host never has to make
      # /var/stack. Both halves are here because a default-root test still can't.
      - name: Create storage root dirs
        run: |
          sudo mkdir -p /var/stack/data /var/stack/backup /var/stack/nodestat
          sudo chmod 0777 /var/stack/data /var/stack/backup /var/stack/nodestat

      - name: swarm e2e
        env:
          PMCLUSTER_E2E_SWARM: "1"
          PMCLUSTER_OO_INSECURE: "1"
        # Run `go test` directly rather than `make e2e`: the Makefile target
        # hardcodes `-timeout 10m`, which is too tight for the full swarm tier
        # (several cluster up/down cycles + image pulls on a fresh runner). The
        # swarm tier needs the 20m budget the docs already specify.
        # -v so the log names every e2e test and whether it PASSed or SKIPped:
        # without it a skipped test is indistinguishable from a passing one, and
        # a skip that hides a real regression looks exactly like a green run.
        run: go test -v -timeout 20m -tags=e2e ./e2e/...