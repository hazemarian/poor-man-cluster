name: pmcluster

on:
  push:
    branches: [main]
    paths:
      - "pmcluster/**"
      - ".github/workflows/pmcluster.yml"
  pull_request:
    paths:
      - "pmcluster/**"
      - ".github/workflows/pmcluster.yml"

jobs:
  test:
    name: build + unit tests + smoke e2e (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25"]
    defaults:
      run:
        working-directory: pmcluster
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: pmcluster/go.sum

      - name: go vet
        run: make vet

      - name: build
        run: make build

      - name: unit tests
        run: make test

      - name: smoke e2e
        run: make e2e

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pmcluster
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: pmcluster/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Must be a v2.x release built with Go ≥ 1.25 — older binaries
          # refuse to read a `go 1.25` module. The action's `latest` on
          # @v6 resolved to v1.64.8 (Go 1.24) and failed; @v8/@v9 + a pinned
          # v2.x avoids that.
          version: v2.12.2
          working-directory: pmcluster
          args: --timeout=5m
