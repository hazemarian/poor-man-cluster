networks:
  net:
    driver: overlay
services:
  worker:
    deploy:
      labels:
        application: minimal-app
        environment: production
        service: worker
        version: latest
      replicas: 1
      restart_policy:
        condition: any
      update_config:
        delay: 10s
        order: start-first
        parallelism: 1
    image: busybox:latest
    networks:
    - net
version: "3.9"
