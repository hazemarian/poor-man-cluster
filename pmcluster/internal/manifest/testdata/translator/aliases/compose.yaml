networks:
  bookfair-net:
    driver: overlay
  monitoring-net:
    external: true
  traefik-net:
    external: true
services:
  api:
    deploy:
      labels:
        application: bookfair
        environment: production
        service: api
        traefik.docker.network: traefik-net
        traefik.enable: "true"
        traefik.http.middlewares.bookfair-api-cors.headers.accesscontrolallowcredentials: "true"
        traefik.http.middlewares.bookfair-api-cors.headers.accesscontrolallowheaders: Content-Type,Authorization,X-Pmcluster-Signature,X-Request-Id
        traefik.http.middlewares.bookfair-api-cors.headers.accesscontrolallowmethods: GET,POST,PUT,PATCH,DELETE,OPTIONS
        traefik.http.middlewares.bookfair-api-cors.headers.accesscontrolalloworiginlistregex: ^(https://idlib-book-fair\.nextrum-sy\.com|https://idlibookfair\.com|https://www\.nextrum-sy\.com)$$
        traefik.http.middlewares.bookfair-api-cors.headers.accesscontrolmaxage: "600"
        traefik.http.middlewares.bookfair-api-cors.headers.addvaryheader: "true"
        traefik.http.routers.bookfair-api-alias0.entrypoints: websecure
        traefik.http.routers.bookfair-api-alias0.middlewares: bookfair-api-cors@swarm
        traefik.http.routers.bookfair-api-alias0.rule: Host(`idlibookfair.com`)
        traefik.http.routers.bookfair-api-alias0.tls: "true"
        traefik.http.routers.bookfair-api-alias1.entrypoints: websecure
        traefik.http.routers.bookfair-api-alias1.middlewares: bookfair-api-cors@swarm
        traefik.http.routers.bookfair-api-alias1.rule: Host(`www.nextrum-sy.com`)
        traefik.http.routers.bookfair-api-alias1.tls: "true"
        traefik.http.routers.bookfair-api.entrypoints: websecure
        traefik.http.routers.bookfair-api.middlewares: bookfair-api-cors@swarm
        traefik.http.routers.bookfair-api.rule: Host(`idlib-book-fair.nextrum-sy.com`)
        traefik.http.routers.bookfair-api.tls: "true"
        traefik.http.services.bookfair-api.loadbalancer.server.port: "8080"
        version: latest
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        delay: 10s
        order: start-first
        parallelism: 1
    image: nginx:latest
    networks:
    - bookfair-net
    - traefik-net
    - monitoring-net
version: "3.9"
