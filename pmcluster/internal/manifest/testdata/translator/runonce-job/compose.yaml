networks:
  net:
    driver: overlay
services:
  migrate:
    command:
    - sh
    - -c
    - echo done
    deploy:
      labels:
        application: batch-job
        environment: production
        service: migrate
        version: latest
      restart_policy:
        condition: none
    environment:
      LOG_LEVEL: warn
    image: alpine:3.19
    networks:
    - net
version: "3.9"
