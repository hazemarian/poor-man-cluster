# edge-stack.yml — pmcluster-edge: smart reverse proxy + gin/HTMX operator
# console (DSL manifest, platform-managed). Rendered by LoadComposeFile through
# the same manifest pipeline as customer app stacks.
#
# Console credentials (edge_admin_password / edge_ui_secret / edge_api_token)
# are provisioned by pmcluster and delivered as Swarm secrets mounted read-only
# at /run/secrets/. The console stores them ONCE into its SQLite DB on the
# pmui-data volume, together with the approval table (SSO identities waiting for a
# role) — so the volume is state, and it is mounted unconditionally.
#
# pmui-data is deliberately NOT declared in a top-level volumes: block. Declared
# with an empty value it becomes a plain docker-managed volume under
# /var/lib/docker/volumes, which the platform's backup agents do not cover;
# referenced by a service but undeclared, the compose writer declares it with a
# bind driver_opts at <volume root>/<app>/<name> (= /var/stack/data/edge/pmui-data),
# which they do. The console's identity table deserves the same backups as any
# other stack's data.
app: edge
env: production
domain: ${DOMAIN}
platform: true
networks:
  - traefik-net
  # monitoring-net carries the OTel collector, which publishes the alias `otel-collector`. The edge
  # joins it to ship its own telemetry (ADR 0010).
  - monitoring-net
services:
  pmcluster-edge:
    image: [[.EdgeImage]]
    replicas: 1
    placement: "[[ if .LeaderNode ]][[.LeaderNode]][[ else ]]manager[[ end ]]"
    env:
      LISTEN_ADDR: ":8042"
      UPSTREAM: "http://host.docker.internal:9090"
      # Always a real directory — see the volume comment above. EDGE_LOGIN_DISABLED
      # only hides the password form now; it never makes the console anonymous.
      DATA_DIR: "/data"
      PMCLUSTER_DOMAIN: "[[.Domain]]"
      API_RATE: "200"
      API_BURST: "400"
      WEBHOOK_RATE: "40"
      WEBHOOK_BURST: "60"
      MAX_CONCURRENT: "128"
      REQUEST_TIMEOUT: "30s"
      BAN_THRESHOLD: "20"
      BAN_DURATION: "10m"
      # The cluster's log_level setting, as the env var both pmcluster
      # binaries read (the daemon directly, the edge through the shared
      # logging helper) so host and container agree.
      PMCLUSTER_LOG_LEVEL: "[[ if .LogLevel ]][[.LogLevel]][[ else ]]info[[ end ]]"
      EDGE_LOGIN_DISABLED: "[[.EdgeLoginDisabled]]"
      EDGE_SSO_ENABLED: "[[.SSOEnabled]]"
      # The managed observability credential — base64(<admin user>:<password>),
      # the same value the observability router's injection middleware sends.
      # The console's /sso-bridge page writes it into the backend SPA's browser
      # storage so the operator is signed in, and it is rendered from one source
      # (RenderInput.ObservabilityBasicAuth), not typed anywhere.
      OBSERVABILITY_BASIC_AUTH: "[[.ObservabilityBasicAuth]]"
      # Self-telemetry — the console is a service like any other (ADR 0010).
      #
      # The endpoint is the collector's OVERLAY alias, not host.docker.internal. Measured: from a
      # container on an overlay network, host.docker.internal (172.17.0.1) times out on 4318 while
      # the collector answers the same POST in 3 ms from the host — so the obvious address is the
      # one that silently never delivers. `otel-collector` on monitoring-net answers 200.
      #
      # The console's container logs are NOT scraped: the collector's receiver_creator skips the
      # `edge` stack on purpose (access-log volume with no query value), which is exactly why the
      # console used to be the one service with no logs anywhere. It ships its own OTLP instead, so
      # keep this pair — removing the endpoint returns the UI to being invisible.
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      # Inside a container os.Hostname() is the container id, so the node name has to be passed in
      # or every console record is the only one in the platform with no machine attached.
      PMCLUSTER_NODE: "[[ if .LeaderNode ]][[.LeaderNode]][[ end ]]"
    volumes:
      - "pmui-data:/data"
    secrets:
      - edge_admin_password
      - edge_ui_secret
      - edge_api_token
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8042/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    labels:
      "traefik.enable": "true"
      "traefik.http.routers.pmcluster-web.rule": "Host(`pmcluster.${DOMAIN}`) && (PathPrefix(`/web/`) || Path(`/web`))"
      "traefik.http.routers.pmcluster-web.entrypoints": "websecure"
      "traefik.http.routers.pmcluster-web.tls": "true"
      [[- if .ACMEEmail]]
      "traefik.http.routers.pmcluster-web.tls.certresolver": "letsencrypt"
      [[- end]]
      [[- if .SSOEnabled]]
      "traefik.http.routers.pmcluster-web.middlewares": "cors-default@file,sso-auth@file"
      [[- else]]
      "traefik.http.routers.pmcluster-web.middlewares": "cors-default@file,admin-auth@file"
      [[- end]]
      # The interactive terminal socket. Its own router, above the console's, WITHOUT the auth
      # middleware — a deliberate, narrow exemption rather than a hole:
      #
      #   * a WebSocket handshake cannot complete behind Traefik's forwardAuth: the gate re-issues
      #     the request to oauth2-proxy and the browser's upgrade never finishes, so the page loads
      #     and the socket dies before the console ever sees it (measured: two "terminal: page
      #     served" lines for one stack, zero "handshake arrived");
      #   * the console therefore requires a TICKET on the socket — an HMAC over stack+service+expiry
      #     keyed with its own session secret, minted only while rendering the page, and that page
      #     is served behind the gate. The ticket binds the socket to one stack, one service, and
      #     expires in two minutes.
      #
      # priority 2000 keeps it ahead of pmcluster-web (default 0) for these exact paths only.
      #
      # BOTH socket paths must be listed. The console has two: a service's terminal
      # (/web/stacks/<stack>/terminal/ws) and a stack's shell (/web/shells/<id>/ws). Listing only the
      # first is a live trap — the shell socket was added later, silently matched pmcluster-web, went
      # through forwardAuth and never completed its handshake: the page opened and typing did nothing.
      # The console checks the same two-minute ticket on both.
      "traefik.http.routers.pmcluster-terminal-ws.rule": "Host(`pmcluster.${DOMAIN}`) && PathRegexp(`^/web/(stacks/[^/]+/terminal|shells/[^/]+)/ws$`)"
      "traefik.http.routers.pmcluster-terminal-ws.entrypoints": "websecure"
      "traefik.http.routers.pmcluster-terminal-ws.tls": "true"
      [[- if .ACMEEmail]]
      "traefik.http.routers.pmcluster-terminal-ws.tls.certresolver": "letsencrypt"
      [[- end]]
      "traefik.http.routers.pmcluster-terminal-ws.priority": "2000"
      "traefik.http.routers.pmcluster-terminal-ws.middlewares": "cors-default@file"
      "traefik.http.routers.pmcluster-terminal-ws.service": "pmcluster"
      "traefik.http.routers.pmcluster-api.rule": "Host(`pmcluster.${DOMAIN}`) && !PathPrefix(`/web/`) && !Path(`/web`)"
      "traefik.http.routers.pmcluster-api.entrypoints": "websecure"
      "traefik.http.routers.pmcluster-api.tls": "true"
      [[- if .ACMEEmail]]
      "traefik.http.routers.pmcluster-api.tls.certresolver": "letsencrypt"
      [[- end]]
      "traefik.http.routers.pmcluster-api.middlewares": "cors-default@file"
      # sso-bridge: serves the observability sign-in bootstrap page (the console's
      # /sso-bridge handler) on the observ.<domain> origin.
      #
      # Why a router and not a redirect: the backend's web app decides whether it
      # is logged in from state kept in the BROWSER (localStorage), and only code
      # executing on that origin can write it. The SSO gate alone leaves the
      # operator at a sign-in form.
      #
      # priority 1000 keeps it ahead of the observability stack's catch-all
      # router for the same host; `service: pmcluster` points it at this console,
      # which shares the Traefik overlay with the observability backend.
      "traefik.http.routers.sso-bridge.rule": "Host(`observ.${DOMAIN}`) && Path(`/sso-bridge`)"
      "traefik.http.routers.sso-bridge.entrypoints": "websecure"
      "traefik.http.routers.sso-bridge.tls": "true"
      [[- if .ACMEEmail]]
      "traefik.http.routers.sso-bridge.tls.certresolver": "letsencrypt"
      [[- end]]
      "traefik.http.routers.sso-bridge.priority": "1000"
      [[- if .SSOEnabled]]
      "traefik.http.routers.sso-bridge.middlewares": "cors-default@file,sso-auth@file"
      [[- else]]
      "traefik.http.routers.sso-bridge.middlewares": "cors-default@file,admin-auth@file"
      [[- end]]
      "traefik.http.routers.sso-bridge.service": "pmcluster"
      "traefik.http.services.pmcluster.loadbalancer.server.port": "8042"
    resources:
      reservations:
        cpus: "0.05"
        memory: 64M
      limits:
        cpus: "0.25"
        memory: 256M
    restart: any
    restart_delay: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"