# edge-stack.yml — pmcluster-edge: smart reverse proxy + gin/HTMX operator
# console (DSL manifest, platform-managed). Rendered by LoadComposeFile through
# the same manifest pipeline as customer app stacks.
#
# Console credentials (edge_admin_password / edge_ui_secret / edge_api_token)
# are provisioned by pmcluster and delivered as Swarm secrets mounted read-only
# at /run/secrets/. The edge reads them on first boot and stores them ONCE into
# its SQLite DB on the pmui-data volume (cluster mode EDGE_LOGIN_DISABLED=true
# is stateless and uses an in-memory store — no volume).
app: edge
env: production
domain: ${DOMAIN}
platform: true
networks:
  - traefik-net
volumes:
  [[- if not .EdgeLoginDisabled]]
  pmui-data: ""
  [[- end]]
services:
  pmcluster-edge:
    image: [[.EdgeImage]]
    replicas: 1
    placement: "[[ if .LeaderNode ]][[.LeaderNode]][[ else ]]manager[[ end ]]"
    # The pull-time credential listener. Published with mode: ingress so the
    # routing mesh answers on 127.0.0.1:9443 on EVERY node and forwards to this
    # one task — the same shape as the collector's 4318, and the reason a node's
    # docker-credential-pmcluster needs no node-IP logic: it dials its own
    # loopback and reaches whichever node runs the edge.
    #
    # It is a Traefik bypass by construction (Traefik knows nothing about this
    # port), so harden-host.sh DROPs 9443 in DOCKER-USER for every non-private
    # source. Even on the private side, nothing is served without a client
    # certificate: TLS requires one signed by the swarm root CA, whose O must be
    # this swarm's ID and whose CN must be a current node (internal/pullcred).
    expose:
      port: 9443
      external: 9443
      mode: ingress
    env:
      LISTEN_ADDR: ":8042"
      UPSTREAM: "http://host.docker.internal:9090"
      DATA_DIR: "[[if .EdgeLoginDisabled]]:memory:[[else]]/data[[end]]"
      PMCLUSTER_DOMAIN: "[[.Domain]]"
      API_RATE: "200"
      API_BURST: "400"
      WEBHOOK_RATE: "40"
      WEBHOOK_BURST: "60"
      MAX_CONCURRENT: "128"
      REQUEST_TIMEOUT: "30s"
      BAN_THRESHOLD: "20"
      BAN_DURATION: "10m"
      # The cluster's log_level setting, as the env var both pmcluster
      # binaries read (the daemon directly, the edge through the shared
      # logging helper) so host and container agree.
      PMCLUSTER_LOG_LEVEL: "[[ if .LogLevel ]][[.LogLevel]][[ else ]]info[[ end ]]"
      EDGE_LOGIN_DISABLED: "[[.EdgeLoginDisabled]]"
      # The credential listener: ":9443" on the published port, and the swarm
      # root CA bind-mounted from this node. The listener asks the daemon for
      # this swarm's ID rather than having it rendered into the stack: a swarm ID
      # in the compose would change the rendered bytes (and force a redeploy) on
      # a swarm re-init, and the daemon is the authority for it anyway.
      PMCLUSTER_CRED_LISTEN: ":9443"
      PMCLUSTER_CRED_CLIENT_CA: "/etc/pmcluster/swarm/swarm-root-ca.crt"
      EDGE_SSO_ENABLED: "[[.SSOEnabled]]"
      # The managed observability credential — base64(<admin user>:<password>),
      # the same value the observability router's injection middleware sends.
      # The console's /sso-bridge page writes it into the backend SPA's browser
      # storage so the operator is signed in, and it is rendered from one source
      # (RenderInput.ObservabilityBasicAuth), not typed anywhere.
      OBSERVABILITY_BASIC_AUTH: "[[.ObservabilityBasicAuth]]"
    volumes:
      [[- if not .EdgeLoginDisabled]]
      - "pmui-data:/data"
      [[- end]]
    binds:
      # The swarm root CA, read-only. Docker writes it on every node that joins
      # (manager or worker), so this source exists wherever the task lands — a
      # bind whose source is missing is rejected at task creation, not at use.
      - "/var/lib/docker/swarm/certificates/swarm-root-ca.crt:/etc/pmcluster/swarm/swarm-root-ca.crt:ro"
    secrets:
      - edge_admin_password
      - edge_ui_secret
      - edge_api_token
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8042/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    labels:
      "traefik.enable": "true"
      "traefik.http.routers.pmcluster-web.rule": "Host(`pmcluster.${DOMAIN}`) && (PathPrefix(`/web/`) || Path(`/web`))"
      "traefik.http.routers.pmcluster-web.entrypoints": "websecure"
      "traefik.http.routers.pmcluster-web.tls": "true"
      [[- if .ACMEEmail]]
      "traefik.http.routers.pmcluster-web.tls.certresolver": "letsencrypt"
      [[- end]]
      [[- if .SSOEnabled]]
      "traefik.http.routers.pmcluster-web.middlewares": "cors-default@file,sso-auth@file"
      [[- else]]
      "traefik.http.routers.pmcluster-web.middlewares": "cors-default@file,admin-auth@file"
      [[- end]]
      "traefik.http.routers.pmcluster-api.rule": "Host(`pmcluster.${DOMAIN}`) && !PathPrefix(`/web/`) && !Path(`/web`)"
      "traefik.http.routers.pmcluster-api.entrypoints": "websecure"
      "traefik.http.routers.pmcluster-api.tls": "true"
      [[- if .ACMEEmail]]
      "traefik.http.routers.pmcluster-api.tls.certresolver": "letsencrypt"
      [[- end]]
      "traefik.http.routers.pmcluster-api.middlewares": "cors-default@file"
      # sso-bridge: serves the observability sign-in bootstrap page (the console's
      # /sso-bridge handler) on the observ.<domain> origin.
      #
      # Why a router and not a redirect: the backend's web app decides whether it
      # is logged in from state kept in the BROWSER (localStorage), and only code
      # executing on that origin can write it. The SSO gate alone leaves the
      # operator at a sign-in form.
      #
      # priority 1000 keeps it ahead of the observability stack's catch-all
      # router for the same host; `service: pmcluster` points it at this console,
      # which shares the Traefik overlay with the observability backend.
      "traefik.http.routers.sso-bridge.rule": "Host(`observ.${DOMAIN}`) && Path(`/sso-bridge`)"
      "traefik.http.routers.sso-bridge.entrypoints": "websecure"
      "traefik.http.routers.sso-bridge.tls": "true"
      [[- if .ACMEEmail]]
      "traefik.http.routers.sso-bridge.tls.certresolver": "letsencrypt"
      [[- end]]
      "traefik.http.routers.sso-bridge.priority": "1000"
      [[- if .SSOEnabled]]
      "traefik.http.routers.sso-bridge.middlewares": "cors-default@file,sso-auth@file"
      [[- else]]
      "traefik.http.routers.sso-bridge.middlewares": "cors-default@file,admin-auth@file"
      [[- end]]
      "traefik.http.routers.sso-bridge.service": "pmcluster"
      "traefik.http.services.pmcluster.loadbalancer.server.port": "8042"
    resources:
      reservations:
        cpus: "0.05"
        memory: 64M
      limits:
        cpus: "0.25"
        memory: 256M
    restart: any
    restart_delay: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"