version: "3.9"

services:
  # pmcluster-edge — the edge service in front of the pmcluster daemon: the
  # smart reverse proxy (per-real-IP throttling, connection/DDoS shield, IP
  # blocklisting with auto-ban) plus the gin+HTMX operator console on the same
  # origin. The console is served on its web routes; every other request is
  # reversed to the daemon. Socketless, talks to the daemon over
  # host.docker.internal:9090 (the same route Traefik used before this stack),
  # so it removes the host-bound 9090 from the public path entirely.
  #
  # Console credentials are provisioned by pmcluster (cluster up / update) and
  # delivered as Swarm secrets mounted read-only at /run/secrets/. The edge
  # container reads them on first boot and stores them ONCE into its SQLite DB
  # on the pmui-data volume:
  #   edge_admin_password  — console login password (user "admin")
  #   edge_ui_secret       — HMAC key for session cookies
  #   edge_api_token       — pmcluster API Bearer token the console uses to reach
  #                          the daemon (dedicated "edge" daemon user)
  # Standalone/local runs fall back to PMCLUSTER_UI_USER/PASS/SECRET and
  # PMCLUSTER_API_TOKEN env vars when no secrets are mounted.
  #
  # Routing: this service publishes itself to Traefik via stack labels — the
  # pmcluster.<domain> origin serves the edge console + reverse proxy, replacing
  # what was previously the direct daemon path and the edge.<domain> subdomain.
  # The shared middlewares it references (cors-default) come from the file
  # provider (traefik-dynamic.yml).
  pmcluster-edge:
    image: [[.EdgeImage]]
    environment:
      - LISTEN_ADDR=:8042
      - UPSTREAM=http://host.docker.internal:9090
      - DATA_DIR=/data
      - API_RATE=200
      - API_BURST=400
      - WEBHOOK_RATE=40
      - WEBHOOK_BURST=60
      - MAX_CONCURRENT=128
      - REQUEST_TIMEOUT=30s
      - BAN_THRESHOLD=20
      - BAN_DURATION=10m
      - LOG_LEVEL=info
    volumes:
      - pmui-data:/data
    secrets:
      - edge_admin_password
      - edge_ui_secret
      - edge_api_token
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - traefik-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8042/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.role == manager]
      labels:
        # Expose the edge console + reverse proxy at pmcluster.<domain>. This
        # replaces the daemon-direct path AND the old edge.<domain> subdomain:
        # pmcluster.<domain> is now the single public origin for the console
        # + API + webhooks, shielded by the edge.
        - "traefik.enable=true"
        # The operator console lives under /web. Traefik gates it with the
        # admin-auth middleware (shared htpasswd via the admin_credentials
        # secret). Everything else (/api + /webhook) falls through to the edge
        # reverse proxy and keeps its own Bearer / webhook-signature auth —
        # no admin-auth there, so the daemon API stays machine-accessible.
        - "traefik.http.routers.pmcluster-web.rule=Host(`pmcluster.${DOMAIN}`) && PathPrefix(`/web`)"
        - "traefik.http.routers.pmcluster-web.entrypoints=websecure"
        - "traefik.http.routers.pmcluster-web.tls=true"
        - "traefik.http.routers.pmcluster-web.tls.certresolver=letsencrypt"
        - "traefik.http.routers.pmcluster-web.middlewares=cors-default@file,admin-auth@file"
        - "traefik.http.routers.pmcluster-api.rule=Host(`pmcluster.${DOMAIN}`) && !PathPrefix(`/web`)"
        - "traefik.http.routers.pmcluster-api.entrypoints=websecure"
        - "traefik.http.routers.pmcluster-api.tls=true"
        - "traefik.http.routers.pmcluster-api.tls.certresolver=letsencrypt"
        - "traefik.http.routers.pmcluster-api.middlewares=cors-default@file"
        - "traefik.http.services.pmcluster.loadbalancer.server.port=8042"
      resources:
        reservations:
          cpus: '0.05'
          memory: 64M
        limits:
          cpus: '0.25'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pmui-data:

secrets:
  edge_admin_password:
    external: true
  edge_ui_secret:
    external: true
  edge_api_token:
    external: true

networks:
  traefik-net:
    external: true
