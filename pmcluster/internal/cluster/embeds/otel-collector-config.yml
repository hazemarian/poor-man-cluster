#
# OTel Collector configuration for pmcluster.
#
# Exporters point at Parseable (observability_parseable:8000). Parseable
# replaces OpenObserve: a single self-contained binary with Parquet storage on
# a mounted volume, and an admin account that comes from env on every boot
# rather than a once-only seed into a metadata volume.
#
# Two log paths, and both are expected to be live:
#   1. receiver_creator + docker_observer — one filelog receiver PER CONTAINER,
#      so a container's stdout/stderr keeps its Swarm service identity. A single
#      filelog receiver could NOT do this: container log paths are built from
#      container ids, there is no operator that reaches the Docker API for
#      labels, and a record without a resolved service.name is unattributable
#      noise. Measured on the live cluster: with one global filelog receiver,
#      528k rows arrived over 24h from OTLP senders only and NOT ONE line of
#      container stdout was ingested (abbas-cms_web wrote 12 lines/minute and
#      contributed zero rows).
#   2. OTLP receiver (gRPC + HTTP) — structured logs from apps with OTel SDKs.
#      Set `skip_filelog: true` on a manifest service that ships its own logs so
#      the same line is not ingested twice; that opt-out suppresses the LOG leg
#      only, never container metrics.
extensions:
  health_check:

  # Offsets for the dynamic filelog receivers, on disk.
  #
  # The receiver_creator recreates a receiver whenever the docker observer re-announces a
  # container, and without storage each new instance starts from `start_at: end` at ITS
  # creation moment — so several instances created within the same second each tail the
  # same file, and every line they all see is ingested once per instance. Measured on the
  # live leader before this existed: one daemon line stored 72 times, and 3,240 receiver
  # starts an hour. The extension is what makes a recreation resume instead of re-tail.
  file_storage:
    directory: /var/lib/otelcol/file_storage
    timeout: 1s

  # Discovers every running container and its Swarm labels. The receiver_creator
  # below turns each one into a filelog receiver, which is the only way a log
  # record can learn which service produced it.
  docker_observer:
    endpoint: "unix:///var/run/docker.sock"
    api_version: "1.44"
    timeout: 5s

receivers:
  otlp:
    protocols:
      grpc: { endpoint: "0.0.0.0:4317" }
      http: { endpoint: "0.0.0.0:4318" }

  docker_stats:
    endpoint: "unix:///var/run/docker.sock"
    collection_interval: 10s
    api_version: "1.44"
    # Promote Swarm container labels directly to metric datapoint attributes.
    # (container_labels_to_metric_labels is the documented dockerstats key;
    #  metric_labels_to_resource_attributes is NOT a real receiver option and
    #  previously produced no attributes, leaving these fields empty.)
    #
    # Names are DOT-separated to match the OTel semantic convention and the
    # resource attributes the receiver_creator sets for logs, so a query groups
    # logs, metrics and traces by the same field name.
    container_labels_to_metric_labels:
      com.docker.swarm.service.name: "service.name"
      com.docker.stack.namespace:    "stack.name"
      com.docker.swarm.node.id:      "swarm.node.id"

  # One filelog receiver per container. The rule decides which containers get
  # one at all, so an opted-out or platform container costs nothing.
  receiver_creator:
    watch_observers: [docker_observer]
    receivers:
      filelog/docker:
        # type == "container" and NOTHING ELSE. Deliberately no `port`
        # condition: the receiver only needs container_id and labels (it reads
        # a file, it never connects to the endpoint), and a port predicate
        # would silently exclude every container that exposes one.
        rule: >-
          type == "container"
          and (labels["io.pmcluster.skip_filelog"] ?? "") != "true"
          and (labels["com.docker.stack.namespace"] ?? "") != "infra"
          and (labels["com.docker.stack.namespace"] ?? "") != "observability"
          and (labels["com.docker.stack.namespace"] ?? "") != "backup"
          and (labels["com.docker.stack.namespace"] ?? "") != "sso"
          and (labels["com.docker.stack.namespace"] ?? "") != "edge"
        config:
          # Checkpointed, so a recreated receiver resumes where the last one stopped
          # instead of re-reading the tail. Without this the churn above multiplies every
          # line by the number of instances that were alive when it was written.
          storage: file_storage
          include:
            - /var/lib/docker/containers/`container_id`/*-json.log
          include_file_name: false
          include_file_path: true
          # end, NOT beginning. Each receiver owns exactly one container's file,
          # but offsets are in memory: with `beginning` every collector restart
          # would re-read up to max-size x max-file per container and re-send it.
          # The cost is that lines written between a container's start and the
          # receiver's start are missed. That is the accepted trade until
          # per-instance checkpointing exists for dynamic receivers.
          start_at: end
          operators:
            # Parse Docker JSON log format: {"log":"...","stream":"stdout|stderr","time":"..."}
            - type: json_parser
              error_mode: ignore
              timestamp:
                parse_from: attributes.time
                layout: '%Y-%m-%dT%H:%M:%S.%LZ'
              # NO severity from `stream`. Docker gives us two streams, not five
              # levels, so mapping stderr→error made every warning, every progress
              # line and every retry an ERROR — and the console then needed a pile of
              # regex hints at QUERY time to guess the level back out of the text.
              # The level belongs to the producer: it is parsed from the record below,
              # and a line that states no level is left without one (rendered as
              # "info", which is the honest reading of "unknown").
            # Move the parsed log message from attributes.log to body.
            - type: move
              from: attributes.log
              to: body
              if: attributes.log != nil
            # THE LEVEL, FROM THE SOURCE. Most of this cluster's software writes
            # zerolog JSON (`{"level":"info",...}`) or logfmt (`level=info`), so the
            # level is in the record itself — parse it here, once, instead of guessing
            # per query. `error_mode: ignore` keeps a non-JSON line (a shell script, a
            # JVM, PostgreSQL) as it was rather than dropping it.
            - type: json_parser
              error_mode: ignore
              parse_from: body
              parse_to: attributes
              if: body matches "^\\s*\\{"
              severity:
                parse_from: attributes.level
                mapping:
                  trace: trace
                  debug: debug
                  info: info
                  warn: warn
                  warning: warn
                  error: error
                  fatal: fatal
                  panic: fatal
            # logfmt fallback: `level=info` with no braces at all.
            - type: regex_parser
              error_mode: ignore
              parse_from: body
              regex: '(?i)\\blevel=(?P<level>trace|debug|info|warn|warning|error|fatal|panic)\\b'
              if: body matches "(?i)\\blevel="
              severity:
                parse_from: attributes.level
                mapping:
                  trace: trace
                  debug: debug
                  info: info
                  warn: warn
                  warning: warn
                  error: error
                  fatal: fatal
                  panic: fatal
          # Resource attributes are what make a stdout line attributable, and
          # they are declared inside `config` rather than as the receiver
          # template's own resource_attributes map: the e2e showed the
          # latter is not applied per endpoint, so every record arrived with
          # an empty service.name and filter/skip_filelog dropped it — no
          # error, no rows, a collector that looks healthy. The filelog
          # receiver's `resource:` map IS honoured, and receiver_creator
          # substitutes backtick expressions inside `config`.
          resource:
            # Swarm services keep their Swarm identity; plain Compose containers
            # fall back to <project>_<service> only when both labels are present.
            # An unlabelled container resolves to "" and is dropped by
            # filter/skip_filelog rather than ingested as anonymous noise.
            service.name: '`("com.docker.swarm.service.name" in labels && labels["com.docker.swarm.service.name"] != "") ? labels["com.docker.swarm.service.name"] : (("com.docker.compose.project" in labels && labels["com.docker.compose.project"] != "" && "com.docker.compose.service" in labels && labels["com.docker.compose.service"] != "") ? labels["com.docker.compose.project"] + "_" + labels["com.docker.compose.service"] : "")`'
            stack.name: '`("com.docker.stack.namespace" in labels && labels["com.docker.stack.namespace"] != "") ? labels["com.docker.stack.namespace"] : (("com.docker.compose.project" in labels && labels["com.docker.compose.project"] != "" && "com.docker.compose.service" in labels && labels["com.docker.compose.service"] != "") ? labels["com.docker.compose.project"] : "")`'
            container.name: '`name`'
            container.id: '`container_id`'
            container.image.name: '`image`'
            # The opt-out, copied onto the record so the logs filter can enforce it
            # independently of the rule above. Intentionally redundant: a silent
            # failure here would ship a service's logs against its explicit wish.
            container.labels.io.pmcluster.skip_filelog: '`labels["io.pmcluster.skip_filelog"] ?? ""`'

  # NO hostmetrics. It scraped this host's /proc and /sys through
  # HOST_PROC/HOST_SYS, so it could only ever describe the node the collector
  # runs on — the leader — and the platform's own daemon now publishes exactly
  # the three series it produced (system.cpu.utilization{state=idle},
  # system.memory.utilization{state=used}, system.cpu.load_average.1m) for
  # EVERY node, because each daemon samples its own /proc and exports OTLP
  # (internal/nodestat). Two producers for one series meant the leader's bucket
  # averaged both, and the collector was re-collecting what a node had already
  # measured about itself.
  #
  # What is lost: nothing that is enabled. The scrapers above were cpu, memory
  # and load only — the same three the daemon emits. What would be lost is the
  # rest of hostmetrics (network, disk, filesystem, per-state CPU), and none of
  # it was ever enabled; if a series is wanted later, the daemon is where it
  # belongs, because it exists on every node instead of only the leader.

processors:
  # memory_limiter is the guard that keeps a failing exporter from growing the
  # collector until the HOST loses its Swarm heartbeat. It must be the FIRST
  # processor in every pipeline.
  #
  # Ceiling = limit_mib + spike_limit_mib = 240MiB, deliberately BELOW the
  # 320MiB container cap in observability-stack.yml: the limiter has to shed
  # data while the process still has room, or the cgroup OOM-kill is what ends
  # a backlog instead — and that takes the collector down with it.
  #
  # 192MiB is ~2x what the collector held with ONE filelog receiver (88-102MiB
  # peak measured across all four live nodes). Per-container receivers raise
  # that: measure RSS per node before widening the rule, and raise limit_mib and
  # the container cap together if the new floor demands it.
  memory_limiter:
    check_interval: 5s
    limit_mib: 192
    spike_limit_mib: 48

  # Drop logs the pipelines must never ship, and drop them HERE rather than with
  # filelog `exclude`: that option matches file PATHS, and container log paths
  # are built from container ids, so name-based globs like `*infra_traefik*`
  # silently match nothing. That is why 4.6M unattributable rows (traefik's own
  # deprecation chatter) were being ingested while the exclusions looked correct.
  filter/skip_filelog:
    error_mode: ignore
    logs:
      log_record:
        # Opt-out a workload sets on itself (DSL: skip_filelog: true). The
        # receiver rule already refuses to start for such a container; this rule
        # is the enforcement that survives a rule change, so an opt-out can never
        # be lost by accident.
        # Dots are NOT escaped: OTTL indexes a map key literally, so
        # attributes["a.b"] reads the key "a.b". The escaped spelling this
        # rule originally shipped with parses to a key containing backslashes,
        # which never equals the attribute the receiver sets — so the opt-out
        # could never fire, even once labels were available.
        - 'resource.attributes["container.labels.io.pmcluster.skip_filelog"] == "true"'
        # Unattributable records. A container whose labels resolved to nothing
        # has no service.name — ungroupable, unalertable noise: 4.6M lines and
        # 48k ERRORs on the live cluster before this rule existed.
        - 'resource.attributes["service.name"] == nil or resource.attributes["service.name"] == ""'
        # Platform chatter with no query value. Enumerated rather than matched
        # with a regex so the collector rejects the config loudly on a typo
        # instead of silently filtering nothing.
        - 'resource.attributes["service.name"] == "infra_traefik"'
        - 'resource.attributes["service.name"] == "observability_otel-collector"'
        - 'resource.attributes["service.name"] == "observability_parseable"'
        - 'resource.attributes["service.name"] == "observability_provision"'
        - 'resource.attributes["service.name"] == "sso_oauth2-proxy"'
        - 'resource.attributes["service.name"] == "backup_volume-backup"'
        - 'resource.attributes["service.name"] == "backup_control-plane-backup"'
        - 'resource.attributes["service.name"] == "backup_seaweedfs"'

  # Docker Engine API calls are PLUMBING, and two components emit them by the
  # thousand: Traefik's swarm provider (--tracing.otlp=true, polling
  # /v1.51/tasks) and pmcluster's own image inspection. Measured on the live
  # cluster: 64,790 `GET /v1.51/tasks` spans from traefik-proxy and ~89,000
  # inspections of a SINGLE image from pmcluster, which together are most of a
  # ~400-span trace. The trace stops reading as the work that happened.
  #
  # Dropped here rather than in either producer: it is one place, it is config,
  # and it needs no rebuild. Nothing operational is lost — a Docker API call is
  # never what an operator is looking for, and the CALLERS' spans (the reconcile
  # pass, the deploy, the HTTP request) all remain.
  #
  # Matched on the span name, which is the only reliable signal: it is
  # "<method> /v1.<api-version>/..." for these calls and names the path.
  filter/drop_docker_api_spans:
    error_mode: ignore
    traces:
      span:
        - 'IsMatch(name, "^[A-Z]+ /v1\\.[0-9]+/")'

  # Copy service.name from the resource onto metric datapoints so they are
  # queryable / groupable in Parseable (docker_stats sets resource attributes but
  # Parseable stores metric fields separately). Logs need no equivalent: the
  # filelog receiver sets these names on the resource itself, and an OTLP sender
  # already carries the service.name IT chose — this guard leaves those alone.
  # ONE statement per attribute, each guarded by its OWN condition. This is not style:
  # measured on 0.165.0, a statement that assigns a MISSING resource attribute to a
  # datapoint attribute (our daemons set service.name but never stack.name) makes the
  # processor DISCARD the datapoint — no error, no log, nothing in the exporter. The
  # symptom was every daemon metric vanishing while container metrics flowed, because a
  # container resource carries both attributes and the daemon resource only one.
  transform/metrics:
    metric_statements:
      - context: datapoint
        conditions:
          - 'resource.attributes["service.name"] != nil'
        statements:
          - set(attributes["service.name"], resource.attributes["service.name"])
      - context: datapoint
        conditions:
          - 'resource.attributes["stack.name"] != nil'
        statements:
          - set(attributes["stack.name"], resource.attributes["stack.name"])

  # ORDER MATTERS, and it is the whole reason a per-node view was broken.
  #
  # With [system, docker] and override:false the FIRST detector to set a value
  # wins, and `system` runs first — so host.name became the CONTAINER's hostname,
  # i.e. a container id like 1af781ba5184. Grouping by that is grouping by
  # container, dressed up as "per node", and it is exactly what a node CPU/memory
  # tile would have charted.
  #
  # The docker detector reports the hostname of the daemon it talks to — the
  # node — and the collector already mounts /var/run/docker.sock, so it needs no
  # extra access. Running it first makes host.name the node name (nxt-sw-1-m)
  # for every signal, container metrics included.
  resourcedetection:
    detectors: [docker, system]
    override: false

  batch:
    send_batch_size: 1000
    timeout: 10s

exporters:
  # Parseable takes OTLP/HTTP on /v1/{logs,metrics,traces}. Two headers are
  # mandatory: X-P-Stream (all signals) names the dataset, and X-P-Log-Source
  # (all signals) names the source — Parseable's reserved OTLP convention is
  # otel-<signal>, and it rejects anything else for logs with
  # "Please use x-p-log-source: otel-logs".
  #
  # encoding MUST be json. Parseable rejects protobuf OTLP bodies with
  # "Protobuf ingestion ..." (verified live: the default proto encoding 400s
  # while the identical json payload returns 200).
  #
  # Authorization is the Basic header built from the managed observability
  # credential, resolved through the shared reference language so no literal
  # ever lands here.
  # retry_on_failure + sending_queue are bounded so a Parseable outage can
  # never make the collector grow without limit.
  otlp_http/parseable-logs:
    logs_endpoint: "http://observability_parseable:8000/v1/logs"
    encoding: json
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 60s
    sending_queue:
      enabled: true
      queue_size: 128
      num_consumers: 4
    headers:
      Authorization: "secret(observability_basic_auth)"
      X-P-Stream: "pmcluster-logs"
      X-P-Log-Source: "otel-logs"

  otlp_http/parseable-metrics:
    metrics_endpoint: "http://observability_parseable:8000/v1/metrics"
    encoding: json
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 60s
    sending_queue:
      enabled: true
      queue_size: 128
      num_consumers: 4
    headers:
      Authorization: "secret(observability_basic_auth)"
      X-P-Stream: "pmcluster-metrics"
      X-P-Log-Source: "otel-metrics"

  otlp_http/parseable-traces:
    traces_endpoint: "http://observability_parseable:8000/v1/traces"
    encoding: json
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 60s
    sending_queue:
      enabled: true
      queue_size: 128
      num_consumers: 4
    headers:
      Authorization: "secret(observability_basic_auth)"
      X-P-Stream: "pmcluster-traces"
      X-P-Log-Source: "otel-traces"

service:
  extensions: [health_check, docker_observer, file_storage]
  telemetry:
    logs:
      level: info
  pipelines:
    logs:
      receivers:  [receiver_creator, otlp]
      processors: [memory_limiter, resourcedetection, filter/skip_filelog, batch]
      exporters:  [otlp_http/parseable-logs]
    metrics:
      receivers:  [docker_stats, otlp]
      processors: [memory_limiter, resourcedetection, transform/metrics, batch]
      exporters:  [otlp_http/parseable-metrics]
    # Node metrics used to need a pipeline of their own: the daemon's samples were
    # written to a host-bound file that the leader's daemon tailed into SQLite. They now
    # travel node → leader over mTLS and the leader records them, so the pipeline is the
    # ordinary one above — a single metrics pipeline, one exporter, and no file to tail.
    traces:
      receivers:  [otlp]
      processors: [memory_limiter, filter/drop_docker_api_spans, batch]
      exporters:  [otlp_http/parseable-traces]