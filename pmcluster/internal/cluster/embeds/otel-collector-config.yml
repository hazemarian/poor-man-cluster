#
# OTel Collector configuration for pmcluster.
#
# Exporters point at Parseable (observability_parseable:8000). Parseable
# replaces OpenObserve: a single self-contained binary with Parquet storage on
# a mounted volume, and an admin account that comes from env on every boot
# rather than a once-only seed into a metadata volume.
#
# Two log paths:
#   1. filelog receiver — scrapes Docker JSON log files from containers
#      that don't use OTLP/SDK (apps that just write to stdout/stderr).
#   2. OTLP receiver (gRPC + HTTP) — accepts structured logs from apps
#      with OTel SDKs. Set `skip_filelog: true` in the pmcluster manifest
#      for services that send logs via OTLP.
extensions:
  health_check:
  # Discover every running container through the local Docker API. The
  # receiver_creator below uses the observer's container id and labels to
  # create one filelog receiver per container, so stdout records retain their
  # Swarm service identity instead of being filtered as unknown noise.
  docker_observer:
    endpoint: "unix:///var/run/docker.sock"
    api_version: "1.44"
    timeout: 5s
    include_all_containers: true

receivers:
  otlp:
    protocols:
      grpc: { endpoint: "0.0.0.0:4317" }
      http: { endpoint: "0.0.0.0:4318" }

  docker_stats:
    endpoint: "unix:///var/run/docker.sock"
    collection_interval: 10s
    api_version: "1.44"
    # Promote Swarm container labels directly to metric datapoint attributes.
    # (container_labels_to_metric_labels is the documented dockerstats key;
    #  metric_labels_to_resource_attributes is NOT a real receiver option and
    #  previously produced no attributes, leaving these fields empty.)
    #
    # Names are DOT-separated to match the OTel semantic convention and the
    # resource processor below, which already sets service.name / stack.name.
    # Underscored names (service_name) meant a query had to know which signal a
    # field came from before it could name it; for metrics the attribute was
    # service_name while the resource said service.name.
    container_labels_to_metric_labels:
      com.docker.swarm.service.name: "service.name"
      com.docker.stack.namespace:    "stack.name"
      com.docker.swarm.node.id:      "swarm.node.id"

  # Node-level CPU and memory. docker_stats only ever sees CONTAINERS, so there
  # was no way to answer "how loaded is this node" — the question that decides
  # whether a node can take another workload.
  #
  # The service mounts the host's /proc and /sys read-only and points gopsutil at
  # them (HOST_PROC/HOST_SYS in the stack), because a container's own /proc is
  # not the host's. mode: global means every node scrapes itself, and the
  # resourcedetection processor tags each series with that node's host.name — so
  # "per node" grouping is honest rather than an aggregation of containers.
  hostmetrics:
    collection_interval: 30s
    scrapers:
      # The double-valued utilization series are enabled because Parseable does
      # not map the int64 usage/count series (their rows arrive with an empty
      # value), so per-node percentages could not otherwise be charted.
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      load:

  # receiver_creator instantiates this filelog receiver once for each
  # port-less Docker container endpoint. The Docker observer supplies the
  # container id and labels; receiver_creator evaluates the backtick
  # expressions for that endpoint before starting the receiver.
  receiver_creator:
    watch_observers: [docker_observer]
    receivers:
      filelog/docker:
        rule: 'type == "container" and port == 0'
        config:
          include:
            - /var/lib/docker/containers/`container_id`/*-json.log
          include_file_name: false
          include_file_path: true
          # Start at end so collector restarts do not replay every historical
          # container log into the backend.
          start_at: end
          operators:
            # Parse Docker JSON log format: {"log":"...","stream":"stdout|stderr","time":"..."}
            - type: json_parser
              error_mode: ignore
              timestamp:
                parse_from: attributes.time
                layout: '%Y-%m-%dT%H:%M:%S.%LZ'
              severity:
                parse_from: attributes.stream
                mapping: { info: stdout, error: stderr }
            # Move the parsed log message from attributes.log to body.
            - type: move
              from: attributes.log
              to: body
              if: attributes.log != nil
        resource_attributes:
          # The coalesce fallback leaves an attribute unset when a non-Swarm
          # container has no matching label, so filter/skip_filelog can report
          # it as unknown instead of inventing a service name.
          service.name: '`labels["com.docker.swarm.service.name"] ?? ""`'
          stack.name: '`labels["com.docker.stack.namespace"] ?? ""`'
          container.name: '`name`'
          container.id: '`container_id`'
          container.image.name: '`image`'
          container.labels.io.pmcluster.skip_filelog: '`labels["io.pmcluster.skip_filelog"] ?? ""`'

processors:
  # memory_limiter is the guard that keeps a failing exporter from growing the
  # collector until the HOST loses its Swarm heartbeat. It must be the FIRST
  # processor in every pipeline.
  #
  # Ceiling = limit_mib + spike_limit_mib = 240MiB, deliberately BELOW the
  # 320MiB container cap in observability-stack.yml: the limiter has to shed
  # data while the process still has room, or the cgroup OOM-kill is what ends
  # a backlog instead — and that takes the collector down with it.
  #
  # 192MiB is ~2x what the collector actually holds (88-102MiB peak measured
  # across all four live nodes). The 270-420MiB it once reached was an
  # UNBOUNDED exporter queue, which the bounded sending_queue +
  # retry_on_failure on each exporter below now prevent.
  memory_limiter:
    check_interval: 5s
    limit_mib: 192
    spike_limit_mib: 48

  # Drop logs from services that opted out via skip_filelog: true.
  # These services send logs via OTLP instead of stdout/stderr.
  # Filters records the pipelines must never ship, and does it HERE rather than
  # with filelog `exclude`: that option matches file PATHS, and container log
  # paths are built from container IDs, so name-based globs like
  # `*infra_traefik*` silently match nothing. That is why 4.6M unattributable
  # rows (traefik's own deprecation chatter) were being ingested while the
  # exclusions looked correct.
  # Docker Engine API calls are PLUMBING, and two components emit them by the
  # thousand: Traefik's swarm provider (--tracing.otlp=true, polling
  # /v1.51/tasks) and pmcluster's own image inspection. Measured on the live
  # cluster: 64,790 `GET /v1.51/tasks` spans from traefik-proxy and ~89,000
  # inspections of a SINGLE image from pmcluster, which together are most of a
  # ~400-span trace. The trace stops reading as the work that happened.
  #
  # Dropped here rather than in either producer: it is one place, it is config,
  # and it needs no rebuild. Nothing operational is lost — a Docker API call is
  # never what an operator is looking for, and the CALLERS' spans (the reconcile
  # pass, the deploy, the HTTP request) all remain.
  #
  # Matched on the span name, which is the only reliable signal: it is
  # "<method> /v1.<api-version>/..." for these calls and names the path.
  filter/drop_docker_api_spans:
    error_mode: ignore
    traces:
      span:
        - 'IsMatch(name, "^[A-Z]+ /v1\\.[0-9]+/")'

  filter/skip_filelog:
    error_mode: ignore
    logs:
      log_record:
        # Opt-out a workload sets on itself.
        - 'resource.attributes["container.labels.io.pmcluster.skip_filelog"] != nil and resource.attributes["container.labels.io.pmcluster.skip_filelog"] == "true"'
        # Unattributable records. resource attributes come from the Swarm
        # service label, so anything the receiver cannot resolve lands with
        # service.name (and node/app/stack) null — ungroupable, unalertable
        # noise: 4.6M lines and 48k ERRORs on the live cluster.
        - 'resource.attributes["service.name"] == nil or resource.attributes["service.name"] == ""'
        # Platform chatter with no query value. Enumerated rather than matched
        # with a regex so the collector rejects the config loudly on a typo
        # instead of silently filtering nothing.
        - 'resource.attributes["service.name"] == "infra_traefik"'
        - 'resource.attributes["service.name"] == "observability_otel-collector"'
        - 'resource.attributes["service.name"] == "observability_parseable"'
        - 'resource.attributes["service.name"] == "observability_provision"'
        - 'resource.attributes["service.name"] == "sso_oauth2-proxy"'
        - 'resource.attributes["service.name"] == "backup_volume-backup"'
        - 'resource.attributes["service.name"] == "backup_control-plane-backup"'
        - 'resource.attributes["service.name"] == "backup_seaweedfs"'

  resource:
    attributes:
      - key: service.name
        action: upsert
        from_attribute: "container.labels.com.docker.swarm.service.name"
      - key: stack.name
        action: upsert
        from_attribute: "container.labels.com.docker.stack.namespace"

  # Copy service.name from resource into metric data points so they are
  # queryable / groupable in Parseable (docker_stats sets resource attributes
  # but they are stored separately from metric fields).
  transform/metrics:
    metric_statements:
      - context: datapoint
        # Only copy resource service.name when it actually exists (OTLP/SDK
        # metrics). Guard so this never clobbers the values docker_stats
        # attaches directly from Swarm container labels — both sides now use the
        # same dot-separated names, so a datapoint and its resource agree.
        conditions:
          - 'resource.attributes["service.name"] != nil'
        statements:
          - set(attributes["service.name"], resource.attributes["service.name"])
          - set(attributes["stack.name"], resource.attributes["stack.name"])

  # ORDER MATTERS, and it is the whole reason a per-node view was broken.
  #
  # With [system, docker] and override:false the FIRST detector to set a value
  # wins, and `system` runs first — so host.name became the CONTAINER's hostname,
  # i.e. a container id like 1af781ba5184. Grouping by that is grouping by
  # container, dressed up as "per node", and it is exactly what a node CPU/memory
  # tile would have charted.
  #
  # The docker detector reports the hostname of the daemon it talks to — the
  # node — and the collector already mounts /var/run/docker.sock, so it needs no
  # extra access. Running it first makes host.name the node name (nxt-sw-1-m)
  # for every signal, container metrics included.
  resourcedetection:
    detectors: [docker, system]
    override: false

  batch:
    send_batch_size: 1000
    timeout: 10s

exporters:
  # Parseable takes OTLP/HTTP on /v1/{logs,metrics,traces}. Two headers are
  # mandatory: X-P-Stream (all signals) names the dataset, and X-P-Log-Source
  # (all signals) names the source — Parseable's reserved OTLP convention is
  # otel-<signal>, and it rejects anything else for logs with
  # "Please use x-p-log-source: otel-logs".
  #
  # encoding MUST be json. Parseable rejects protobuf OTLP bodies with
  # "Protobuf ingestion ..." (verified live: the default proto encoding 400s
  # while the identical json payload returns 200).
  #
  # Authorization is Basic <base64(admin user:admin password)> — the SAME
  # managed credential Parseable itself boots with, resolved through the
  # shared secret reference language so no literal ever lands here.
  # retry_on_failure + sending_queue are bounded so a Parseable outage can
  # never make the collector grow without limit.
  otlphttp/parseable-logs:
    logs_endpoint: "http://observability_parseable:8000/v1/logs"
    encoding: json
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 60s
    sending_queue:
      enabled: true
      queue_size: 128
      num_consumers: 4
    headers:
      Authorization: "secret(observability_basic_auth)"
      X-P-Stream: "pmcluster-logs"
      X-P-Log-Source: "otel-logs"

  otlphttp/parseable-metrics:
    metrics_endpoint: "http://observability_parseable:8000/v1/metrics"
    encoding: json
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 60s
    sending_queue:
      enabled: true
      queue_size: 128
      num_consumers: 4
    headers:
      Authorization: "secret(observability_basic_auth)"
      X-P-Stream: "pmcluster-metrics"
      X-P-Log-Source: "otel-metrics"

  otlphttp/parseable-traces:
    traces_endpoint: "http://observability_parseable:8000/v1/traces"
    encoding: json
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 60s
    sending_queue:
      enabled: true
      queue_size: 128
      num_consumers: 4
    headers:
      Authorization: "secret(observability_basic_auth)"
      X-P-Stream: "pmcluster-traces"
      X-P-Log-Source: "otel-traces"

service:
  extensions: [health_check, docker_observer]
  telemetry:
    logs:
      level: info
  pipelines:
    # Keep stdout scraping separate from SDK logs. The skip_filelog filter is
    # intentionally scoped to the Docker receiver: applying it to a combined
    # pipeline can drop OTLP records whose service resource is absent or whose
    # service happens to share a platform name.
    logs/filelog:
      receivers:  [receiver_creator]
      processors: [memory_limiter, resourcedetection, filter/skip_filelog, batch]
      exporters:  [otlphttp/parseable-logs]
    logs/otlp:
      receivers:  [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters:  [otlphttp/parseable-logs]
    metrics:
      receivers:  [docker_stats, hostmetrics, otlp]
      processors: [memory_limiter, resourcedetection, resource, transform/metrics, batch]
      exporters:  [otlphttp/parseable-metrics]
    traces:
      receivers:  [otlp]
      processors: [memory_limiter, filter/drop_docker_api_spans, batch]
      exporters:  [otlphttp/parseable-traces]
