# observability-stack.yml — OpenObserve + OTel collector (DSL manifest,
# platform-managed). Rendered by LoadComposeFile through the same manifest
# pipeline as customer app stacks.
app: observability
env: production
domain: ${DOMAIN}
platform: true
networks:
  - monitoring-net
volumes:
  openobserve_data: ""
secrets:
  - zo_root_user_password
services:
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:v0.92.2
    replicas: 1
    placement: "[[ if .PlatformNode ]][[.PlatformNode]][[ else ]]manager[[ end ]]"
    # openobserve joins traefik-net (Traefik routers) in addition to the
    # app-level monitoring-net; the otel-collector joins only monitoring-net.
    networks:
      - traefik-net
    env:
      ZO_DATA_DIR: /data
      ZO_HTTP_PORT: "5080"
      ZO_GRPC_PORT: "5081"
      ZO_TELEMETRY: "false"
      ZO_APP_NAME: openobserve
      ZO_ROOT_USER_EMAIL: "${OPENOBSERVE_ADMIN_EMAIL}"
      ZO_ROOT_USER_PASSWORD: "secret(oo_admin_password)"
      ZO_LOGS_RETENTION_DAYS: "[[.OOLogsRetentionDays]]"
      ZO_METRICS_RETENTION_DAYS: "[[.OOMetricsRetentionDays]]"
      ZO_TRACES_RETENTION_DAYS: "[[.OOTracesRetentionDays]]"
    volumes:
      - "openobserve_data:/data"
    labels:
      "traefik.enable": "true"
      "traefik.http.routers.openobserve.rule": "Host(`observ.${DOMAIN}`)"
      "traefik.http.services.openobserve.loadbalancer.server.port": "5080"
      "traefik.http.routers.openobserve.entrypoints": "websecure"
      "traefik.http.routers.openobserve.tls": "true"
      [[- if .ACMEEmail]]
      "traefik.http.routers.openobserve.tls.certresolver": "letsencrypt"
      [[- end]]
      [[- if .SSOEnabled]]
      "traefik.http.routers.openobserve.middlewares": "cors-default@file,sso-auth@file,openobserve-auto-auth@file"
      [[- else]]
      "traefik.http.routers.openobserve.middlewares": "cors-default@file,admin-auth@file,openobserve-auto-auth@file"
      [[- end]]
      "traefik.swarm.network": "traefik-net"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.157.0
    mode: global
    user: "0:0"
    restart: any
    restart_delay: 5s
    command: ["--config=/etc/otel-collector-config.yaml"]
    expose:
      port: 4318
      external: 4318
      mode: host
    binds:
      - "/var/lib/docker/containers:/var/lib/docker/containers:ro"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "/etc/localtime:/etc/localtime:ro"
    configs:
      - config_path(pmcluster_otel_config)
    resources:
      reservations:
        cpus: "0.3"
        memory: 256M
      limits:
        cpus: "0.4"
        memory: 512M