# observability-stack.yml — Parseable + OTel collector (DSL manifest,
# platform-managed). Rendered by LoadComposeFile through the same manifest
# pipeline as customer app stacks.
#
# Parseable replaces OpenObserve. One self-contained binary, Parquet on mounted
# volumes (no database engine, no external dependency), ~70MB resident. Its
# admin account is read from env on EVERY boot, so the platform's managed
# credential always applies — unlike OpenObserve, which seeded its root user
# once into its metadata volume and then silently drifted from the configured
# password.
app: observability
env: production
domain: ${DOMAIN}
platform: true
networks:
  - monitoring-net
volumes:
  parseable_data: ""
  parseable_staging: ""
services:
  parseable:
    image: parseable/parseable:v2.8.0
    replicas: 1
    placement: "[[ if .ObservabilityNode ]][[.ObservabilityNode]][[ else if .LeaderNode ]][[.LeaderNode]][[ else ]]manager[[ end ]]"
    # Published on the HOST, not the routing mesh: the port is bound only on the
    # node running this task, so exactly ONE node listens. The daemon on every
    # node reads it at the platform node address on the cluster private network,
    # which ./harden-host.sh allows while denying the WAN. Ingress publishing
    # would bind all four nodes for a reader that needs one.
    # The port must stay in step with cluster.ObservabilityPort.
    ports:
      - target: 8000
        published: 8000
        mode: host
    # parseable joins traefik-net (Traefik routers) in addition to the
    # app-level monitoring-net; the otel-collector joins only monitoring-net.
    networks:
      - traefik-net
    # local-store: single node, Parquet on the mounted volumes. The FULL argv is
    # required: the image declares no ENTRYPOINT, so a bare subcommand is exec'd
    # directly and fails with `exec: "local-store": executable file not found`.
    command: ["/usr/bin/parseable", "local-store"]
    env:
      P_ADDR: "0.0.0.0:8000"
      # ONE login everywhere: the same managed observability admin credential
      # the OTel collector authenticates with and the operator signs into the
      # UI with. Retained from the OpenObserve era, so migration rotates
      # nothing. Resolved from the credential store at render time — never a
      # literal in this file.
      P_USERNAME: "[[.ObservabilityAdminEmail]]"
      P_PASSWORD: "secret(observability_admin_password)"
      P_FS_DIR: "/data"
      P_STAGING_DIR: "/staging"
      P_INDEX_DIR: "/data/index"
      # The platform owns the lifecycle: no phone-home, no update check.
      P_SEND_ANONYMOUS_USAGE_DATA: "false"
      P_CHECK_UPDATE: "false"
    volumes:
      - "parseable_data:/data"
      - "parseable_staging:/staging"
    labels:
      "traefik.enable": "true"
      "traefik.http.routers.observability.rule": "Host(`observ.${DOMAIN}`)"
      "traefik.http.routers.observability.entrypoints": "websecure"
      "traefik.http.routers.observability.tls": "true"
      [[- if .ACMEEmail]]
      "traefik.http.routers.observability.tls.certresolver": "letsencrypt"
      [[- end]]
      [[- if .SSOEnabled]]
      "traefik.http.routers.observability.middlewares": "cors-default@file,observability-root-redirect@file,sso-auth@file,observability-auto-auth@file"
      [[- else]]
      "traefik.http.routers.observability.middlewares": "cors-default@file,observability-root-redirect@file,admin-auth@file,observability-auto-auth@file"
      [[- end]]
      "traefik.http.services.observability.loadbalancer.server.port": "8000"
      "traefik.swarm.network": "traefik-net"
    # Capped so a runaway backend is killed inside its own cgroup instead of
    # starving the host into losing its Swarm heartbeat.
    resources:
      reservations:
        cpus: "0.1"
        memory: 128M
      limits:
        cpus: "0.5"
        memory: 768M

  # Per-stream retention, applied from INSIDE the swarm network by a one-shot.
  #
  # Parseable takes no retention from env, from a flag or from a config file —
  # it is API-only — so an API call has to live somewhere. It lives here rather
  # than in the daemon because the daemon is a systemd HOST process and cannot
  # resolve observability_parseable; calling from inside means Parseable needs
  # no published port at all and is reachable only where it is needed.
  #
  # run_once renders restart_policy: none — it applies retention and exits. The
  # script retries until the server answers, because swarm ignores depends_on on
  # this path, and it is best-effort: an unreachable backend must never fail the
  # deploy.
  provision:
    image: curlimages/curl:8.10.1
    run_once: true
    placement: "[[ if .ObservabilityNode ]][[.ObservabilityNode]][[ else if .LeaderNode ]][[.LeaderNode]][[ else ]]manager[[ end ]]"
    networks:
      - monitoring-net
    configs:
      - config_path(pmcluster_observability_provision)
    command: ["sh", "/etc/pmcluster/observability-provision.sh"]
    env:
      P_BASE: "http://observability_parseable:8000"
      P_USER: "[[.ObservabilityAdminEmail]]"
      P_PASS: "secret(observability_admin_password)"
      LOGS_RETENTION_DAYS: "[[.ObservabilityLogsRetentionDays]]"
      METRICS_RETENTION_DAYS: "[[.ObservabilityMetricsRetentionDays]]"
      TRACES_RETENTION_DAYS: "[[.ObservabilityTracesRetentionDays]]"
    resources:
      reservations:
        cpus: "0.02"
        memory: 16M
      limits:
        cpus: "0.2"
        memory: 64M

  # ONE collector task, pinned to the leader.
  #
  # This used to be `mode: global`. Two of the collector's three jobs are
  # node-local by construction — docker_stats reads THIS node's docker socket,
  # filelog tails THIS node's /var/lib/docker/containers — so a copy per node
  # was the only way to collect container telemetry, and that is what changes
  # here deliberately:
  #
  #   1. The question the console must answer after an outage ("what process is
  #      eating nxt-sw-4-m") could never come from container metrics or from
  #      hostmetrics: hostmetrics only ever scrapes its OWN host. Each node's
  #      DAEMON samples its own /proc and exports OTLP (internal/nodestat), so
  #      per-node numbers no longer need a local collector at all.
  #   2. Four collectors cost four reservations and four 88-102MiB RSS
  #      baselines on a fleet of 1-vCPU / 2GB nodes — a real fraction of the box
  #      that had just fallen over.
  #
  # What the single task means in practice: docker_stats and filelog describe
  # the LEADER's containers only. Node-level CPU/memory/process data comes from
  # every node's daemon, which is the source the 2026-11-08 post-mortem needed.
  #
  # Placement is the manager CONSTRAINT (one of every service's floor) plus a
  # HARD constraint on node.labels.pmcluster.leader. A preference was tried first
  # and it does not work: a preference only orders the nodes that already satisfy
  # every constraint, and the scheduler keeps a RUNNING task where it is, so the
  # collector stayed on a former leader (measured: 5-m carried the label, the task
  # sat on 4-m, and GET /api/node-stats answered {"node_stats":[]} forever because
  # the JSONL was written on a disk the leader's daemon does not read).
  #
  # The daemon maintains the label as an INVARIANT: stamped on leadership gain,
  # re-asserted on every leader tick (a constraint has no schedulable floor to
  # fall back to), cleared on loss. `cluster update` refuses to deploy this stack
  # when no node carries the label, naming the condition, rather than leaving a
  # service at 0/1. And because `docker stack deploy` rewrites the spec without
  # moving a running task, the reconcile pass force-updates the collector when its
  # rendered placement changed.
  #
  # The node-stats JSONL lands under /var/stack and is bind-mounted at the same
  # path, so the leader's daemon can read exactly what this task wrote. Rotation
  # is the only cleanup: the exporter holds the file open, and a reader that
  # truncated it would leave a sparse NUL-filled middle.
  #
  # Host mode was the previous publish shape, and it was a trap worth naming. It
  # published 4318 ONLY on the node running the task, while the daemon's endpoint
  # was the constant http://127.0.0.1:4318 — a closed port on every other node.
  # The OTel SDK's default error handler logs every failed export unbounded, so
  # on 2026-11-08 node nxt-sw-4-m (1 vCPU) wrote 261,617 journal lines from one
  # daemon boot (238,951 / 213,808 / 196,367 / 151,609 / 71,180 from other
  # incarnations); journald writes starved docker's heartbeat, the swarm marked
  # the node Down and leadership moved off it. 2026-10-16 was the same failure in
  # miniature: `dial tcp 127.0.0.1:4318: connect: connection refused` on a worker
  # running no collector.
  #
  # So 4318 stays ingress-published: the routing mesh binds it on EVERY node and
  # forwards to the single task. The daemon dials THIS node's swarm address
  # (config.ResolveOTLPEndpoint), never localhost and never the overlay name —
  # a host process cannot resolve overlay DNS.
  #
  # 4318 is still not public: it is a documented Traefik bypass, and
  # harden-host.sh DROPs it in DOCKER-USER for every non-private source. That
  # rule is what makes an ingress publish acceptable — without it, ingress would
  # put the collector on all four public interfaces, and an unauthenticated OTLP
  # receiver is an open ingestion endpoint.
  #
  # Sizing: reserve ~the measured steady state, cap at ~3x the measured peak, and
  # keep the collector's own memory_limiter (otel-collector-config.yml) strictly
  # BELOW this cap so the limiter sheds load while the process still has room
  # instead of the cgroup OOM-killing it.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.157.0
    # One task on the leader. NOT global: see the block above for why, and for
    # why the leader is a hard constraint rather than a preference.
    replicas: 1
    placement: manager
    constraints:
      - "node.labels.pmcluster.leader==true"
    user: "0:0"
    restart: any
    restart_delay: 5s
    command: ["--config=/etc/otel-collector-config.yaml"]
    env:
      # gopsutil reads these to locate the HOST's proc/sys rather than its own.
      HOST_PROC: "/hostfs/proc"
      HOST_SYS: "/hostfs/sys"
    expose:
      port: 4318
      external: 4318
      # ingress, not host: the routing mesh binds 4318 on EVERY node and forwards
      # to this service's task wherever it runs, so a host-process daemon can
      # dial its own node's swarm address and always reach a collector. See the
      # long note above for what that buys and what it costs.
      mode: ingress
    binds:
      - "/var/lib/docker/containers:/var/lib/docker/containers:ro"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "/etc/localtime:/etc/localtime:ro"
      # Read-only host views for the hostmetrics receiver. A container's /proc is
      # its own, so node CPU/memory would otherwise report the collector's cgroup
      # rather than the node's. Read-only, and nothing is written back.
      - "/proc:/hostfs/proc:ro"
      - "/sys:/hostfs/sys:ro"
      # The node-stats file the collector's file exporter appends to. Same path
      # inside and out, so the leader's daemon reads exactly what this task
      # wrote. The host directory is created by `cluster up` / `cluster update`
      # (cluster.NodeStatHostDir) BEFORE this stack is deployed: Docker rejects
      # a bind whose source is missing, and "bind source path does not exist:
      # /var/stack/nodestat" is how the collector sat at 0/1 on four nodes.
      - "[[ .NodeStatDir ]]:[[ .NodeStatDir ]]"
    configs:
      - config_path(pmcluster_otel_config)
    resources:
      reservations:
        cpus: "0.05"
        memory: 96M
      limits:
        cpus: "0.25"
        memory: 320M
