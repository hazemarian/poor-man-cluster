## pmcluster-config-version: __PMCONFIG_VERSION__
# Generated by pmcluster cluster up. Shipped as a Docker config so it's
# replicated to every Swarm node automatically.
http:
  middlewares:
    admin-auth:
      basicAuth:
        usersFile: /run/secrets/admin_credentials
    # cors-default: applied to every managed router (pmcluster, traefik
    # dashboard, portainer, openobserve) AND every exposed app router
    # emitted by the manifest translator. Origins are restricted to
    # https://<any-subdomain>.<cluster-domain> + https://<cluster-domain>
    # via a regex derived from cluster up --domain. Echoed origins keep
    # accessControlAllowCredentials valid (spec forbids "*" + credentials).
    cors-default:
      headers:
        customResponseHeaders:
          Access-Control-Allow-Origin: "https://[[.Domain]]"
          Access-Control-Allow-Methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
          Access-Control-Allow-Headers: "Content-Type,Authorization,X-Pmcluster-Signature,X-Request-Id"
          Access-Control-Allow-Credentials: "true"
          Access-Control-Max-Age: "600"
          Vary: "Origin"
  routers:
    pmcluster:
      rule: "Host(`pmcluster.[[.Domain]]`)"
      entrypoints: [websecure]
      service: pmcluster
      middlewares:
        - cors-default
      tls:
        [[- if .ACMEEmail]]
        certResolver: letsencrypt
        [[- end]]
  services:
    pmcluster:
      loadBalancer:
        servers:
          # NOTE: still routing the public path DIRECTLY to the daemon on 9090
          # until the pmcluster-edge smart proxy is verified end-to-end. Once
          # the edge is confirmed working, flip this single line to:
          #   http://edge_pmcluster-edge:8042
          # (the edge then adds per-real-IP throttling, a connection/DDoS shield,
          # IP blocklisting/auto-ban, and the HTMX dashboard, and forwards the
          # API + webhook to the daemon over host.docker.internal:9090 itself).
          - url: "http://host.docker.internal:9090"
[[- if not .ACMEEmail]]
tls:
  certificates:
    - certFile: /run/secrets/[[.CertSecretName]]
      keyFile: /run/secrets/[[.KeySecretName]]
  stores:
    default:
      defaultCertificate:
        certFile: /run/secrets/[[.CertSecretName]]
        keyFile: /run/secrets/[[.KeySecretName]]
[[- end]]
