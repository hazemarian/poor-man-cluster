# Generated by pmcluster cluster up. Shipped as a Docker config so it's
# replicated to every Swarm node automatically.
http:
  middlewares:
    admin-auth:
      basicAuth:
        usersFile: /run/secrets/admin_credentials
    # cors-default: applied to every exposed/app router emitted by the manifest
    # translator plus those mounted via stack labels (edge console,
    # openobserve). Origins are restricted to
    # https://<any-subdomain>.<cluster-domain> + https://<cluster-domain>
    # via a regex derived from cluster up --domain. Echoed origins keep
    # accessControlAllowCredentials valid (spec forbids "*" + credentials).
    #
    # NOTE: pmcluster.<domain> is NOT routed here. The pmcluster-edge service
    # publishes itself to Traefik via its own stack labels (see edge-stack.yml),
    # so this file holds only shared middlewares, not the pmcluster router.
    cors-default:
      headers:
        customResponseHeaders:
          Access-Control-Allow-Origin: "https://[[.Domain]]"
          Access-Control-Allow-Methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
          Access-Control-Allow-Headers: "Content-Type,Authorization,X-Pmcluster-Signature,X-Request-Id"
          Access-Control-Allow-Credentials: "true"
          Access-Control-Max-Age: "600"
          Vary: "Origin"
[[- if not .ACMEEmail]]
tls:
  certificates:
    - certFile: /run/secrets/[[.CertSecretName]]
      keyFile: /run/secrets/[[.KeySecretName]]
  stores:
    default:
      defaultCertificate:
        certFile: /run/secrets/[[.CertSecretName]]
        keyFile: /run/secrets/[[.KeySecretName]]
[[- end]]
