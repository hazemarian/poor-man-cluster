# Generated by pmcluster cluster up. Shipped as a Docker config so it's
# replicated to every Swarm node automatically.
http:
  middlewares:
[[- if .SSOEnabled]]
    # SSO gate (oauth2-proxy). When SSO is enabled the pmcluster-web +
    # observ. routers use this forwardAuth instead of the htpasswd
    # admin-auth below. oauth2-proxy runs in the sso stack on traefik-net;
    # X-Forwarded-User / X-Forwarded-Email are passed to the downstream
    # console + OpenObserve.
    sso-auth:
      forwardAuth:
        address: "http://sso_oauth2-proxy:4180"
        authResponseHeaders:
          - X-Forwarded-User
          - X-Forwarded-Email
          - X-Forwarded-Preferred-Username
[[- else]]
    admin-auth:
      basicAuth:
        usersFile: /run/secrets/admin_credentials
[[- end]]
    # observability-auto-auth: injected AFTER admin-auth (or sso-auth) has let
    # the operator through, so Parseable is reached already authenticated —
    # its API and ingest endpoints honour HTTP Basic. MUST stay paired with the
    # gate middleware above; alone it would be a public root credential. The
    # value is base64(<admin user>:<admin password>), rendered from the same
    # managed credential the Parseable admin account is created with, so the
    # collector, the UI and the operator all use ONE login.
    #
    # NOTE: unlike OpenObserve, Parseable's SPA keeps its own session
    # client-side and has no server-side cookie that can be minted here, so
    # there is no Set-Cookie half. The header authenticates the API and the
    # OTLP ingest paths; the UI's own sign-in uses the same managed
    # credential (visible under Configs & Secrets).
    [[- if .ObservabilityBasicAuth]]
    observability-auto-auth:
      headers:
        customRequestHeaders:
          Authorization: "[[.ObservabilityBasicAuth]]"
    [[- end]]
    # observability-root-redirect: OpenObserve's UI lived at /web/; Parseable
    # serves its SPA at /. Parseable answers /web/ with HTTP 200, but the SPA's
    # client-side router then renders its OWN not-found view — so an old
    # bookmark or link shows a 404 in the browser even though the request
    # succeeded at the edge. Redirect those paths to the root instead.
    #
    # Unconditional (not inside the SSOEnabled branch): it is a path rewrite, and
    # the auth gate still applies to wherever it lands.
    observability-root-redirect:
      redirectRegex:
        # A capture group rather than a domain placeholder: RenderTraefikDynamic
        # runs the Go template pass but NOT the shell-style substitution (only the
        # compose path does that), so a placeholder here would ship as a literal.
        regex: "^https?://([^/]+)/web/?$"
        replacement: "https://$1/"
        permanent: false
    # cors-default: applied to every exposed/app router emitted by the manifest
    # translator plus those mounted via stack labels (edge console,
    # openobserve). Origins are restricted to
    # https://<any-subdomain>.<cluster-domain> + https://<cluster-domain>
    # via a regex derived from cluster up --domain. Echoed origins keep
    # accessControlAllowCredentials valid (spec forbids "*" + credentials).
    #
    # NOTE: pmcluster.<domain> is NOT routed here. The pmcluster-edge service
    # publishes itself to Traefik via its own stack labels (see edge-stack.yml),
    # so this file holds only shared middlewares, not the pmcluster router.
    cors-default:
      headers:
        # Traefik's native origin-list regex ECHOES the matched request origin
        # back as Access-Control-Allow-Origin. This is the only way to keep
        # allowCredentials valid while permitting every subdomain of the
        # cluster domain (a fixed customResponseHeader would reject e.g.
        # campaign.<domain> when the API lives on donation-campaign.<domain>).
        accessControlAllowOriginListRegex:
          - '[[.CORSOriginRegex]]'
        accessControlAllowCredentials: true
        accessControlAllowMethods:
          - "GET,POST,PUT,PATCH,DELETE,OPTIONS"
        accessControlAllowHeaders:
          - "Content-Type,Authorization,X-Pmcluster-Signature,X-Request-Id"
        accessControlMaxAge: 600
        addVaryHeader: true
[[- if not .ACMEEmail]]
tls:
  certificates:
    - certFile: /run/secrets/[[.CertSecretName]]
      keyFile: /run/secrets/[[.KeySecretName]]
  stores:
    default:
      defaultCertificate:
        certFile: /run/secrets/[[.CertSecretName]]
        keyFile: /run/secrets/[[.KeySecretName]]
[[- end]]
