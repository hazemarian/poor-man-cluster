# Generated by pmcluster cluster up. Shipped as a Docker config so it's
# replicated to every Swarm node automatically.
http:
  middlewares:
[[- if .SSOEnabled]]
    # SSO gate (oauth2-proxy). When SSO is enabled the pmcluster-web +
    # observ. routers use this forwardAuth instead of the htpasswd
    # admin-auth below. oauth2-proxy runs in the sso stack on traefik-net;
    # X-Forwarded-User / X-Forwarded-Email are passed to the downstream
    # console + OpenObserve.
    sso-auth:
      forwardAuth:
        address: "http://sso_oauth2-proxy:4180"
        authResponseHeaders:
          - X-Forwarded-User
          - X-Forwarded-Email
          - X-Forwarded-Preferred-Username
[[- else]]
    admin-auth:
      basicAuth:
        usersFile: /run/secrets/admin_credentials
[[- end]]
    # openobserve-auto-auth: injected AFTER admin-auth (or sso-auth) has let
    # the operator through, so OpenObserve auto-authenticates every request
    # (its UI's session-check API honours HTTP Basic auth) and its own login
    # page is never shown. MUST stay paired with the gate middleware — alone
    # it is a public root credential. The value is base64(<OO root email>:<OO
    # root password>), rendered from the managed openobserve_admin credential.
    #
    # The auth_tokens Set-Cookie response header is the SPA half of the fix:
    # OO's web session is cookie-based (the SPA self-navigates to /web/login
    # when the cookie is absent even though the header authenticates the API).
    # The cookie value is the base64url JSON envelope OO itself would mint on
    # POST /auth/login — {"access_token":"<the same Basic value>","refresh_token":""}
    # — computed deterministically from the same credential, so it stays valid
    # across password rotations. 30-day expiry mirrors OO's own session.
    [[- if .OpenObserveBasicAuth]]
    openobserve-auto-auth:
      headers:
        customRequestHeaders:
          Authorization: "[[.OpenObserveBasicAuth]]"
        customResponseHeaders:
          Set-Cookie: "auth_tokens=[[.OpenObserveSessionCookie]]; HttpOnly; SameSite=Lax; Path=/; Max-Age=2592000"
    [[- end]]
    # cors-default: applied to every exposed/app router emitted by the manifest
    # translator plus those mounted via stack labels (edge console,
    # openobserve). Origins are restricted to
    # https://<any-subdomain>.<cluster-domain> + https://<cluster-domain>
    # via a regex derived from cluster up --domain. Echoed origins keep
    # accessControlAllowCredentials valid (spec forbids "*" + credentials).
    #
    # NOTE: pmcluster.<domain> is NOT routed here. The pmcluster-edge service
    # publishes itself to Traefik via its own stack labels (see edge-stack.yml),
    # so this file holds only shared middlewares, not the pmcluster router.
    cors-default:
      headers:
        customResponseHeaders:
          Access-Control-Allow-Origin: "https://[[.Domain]]"
          Access-Control-Allow-Methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
          Access-Control-Allow-Headers: "Content-Type,Authorization,X-Pmcluster-Signature,X-Request-Id"
          Access-Control-Allow-Credentials: "true"
          Access-Control-Max-Age: "600"
          Vary: "Origin"
[[- if not .ACMEEmail]]
tls:
  certificates:
    - certFile: /run/secrets/[[.CertSecretName]]
      keyFile: /run/secrets/[[.KeySecretName]]
  stores:
    default:
      defaultCertificate:
        certFile: /run/secrets/[[.CertSecretName]]
        keyFile: /run/secrets/[[.KeySecretName]]
[[- end]]
