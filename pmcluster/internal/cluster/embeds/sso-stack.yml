# sso-stack.yml — oauth2-proxy sidecar (SSO gate) as a DSL manifest,
# platform-managed. Deployed only when SSO is enabled. oauth2-proxy terminates
# the OAuth flow with the provider (GitHub) and exposes /oauth2/* endpoints;
# Traefik's sso-auth forwardAuth middleware points at this service.
#
# oauth2-proxy serves the OAuth endpoints on EVERY gated host (pmcluster.,
# observ., sso.): the forwardAuth 302 uses the ORIGINAL request's host, so
# /oauth2/start must resolve there too. Each gated host gets a dedicated
# PathPrefix(/oauth2) router with an explicit priority above the host's
# catch-all router and NO auth middleware (the flow itself is the auth).
app: sso
env: production
domain: ${DOMAIN}
platform: true
networks:
  - traefik-net
services:
  oauth2-proxy:
    image: public.ecr.aws/extremecloud/bitnami/oauth2-proxy:v7.11.0
    replicas: 1
    placement: "[[ if .PlatformNode ]][[.PlatformNode]][[ else ]]manager[[ end ]]"
    restart: any
    env:
      OAUTH2_PROXY_PROVIDER: github
      OAUTH2_PROXY_CLIENT_ID: "[[.SSOClientID]]"
      OAUTH2_PROXY_CLIENT_SECRET: "[[.SSOClientSecret]]"
      [[- if .SSOGitHubOrg]]
      OAUTH2_PROXY_GITHUB_ORG: "[[.SSOGitHubOrg]]"
      [[- end]]
      [[- if .SSOGitHubRepos]]
      OAUTH2_PROXY_GITHUB_REPOS: "[[.SSOGitHubRepos]]"
      [[- end]]
      OAUTH2_PROXY_COOKIE_SECRET: "[[.SSOCookieSecret]]"
      OAUTH2_PROXY_HTTP_ADDRESS: "http://:4180"
      OAUTH2_PROXY_UPSTREAMS: "static://202"
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: "lax"
      OAUTH2_PROXY_COOKIE_EXPIRE: "[[.SSOCookieExpire]]"
      OAUTH2_PROXY_COOKIE_DOMAINS: ".[[.Domain]]"
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_WHITELIST_DOMAINS: ".[[.Domain]]"
      OAUTH2_PROXY_REDIRECT_URL: "https://sso.[[.Domain]]/oauth2/callback"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "false"
    labels:
      "traefik.enable": "true"
      "traefik.http.routers.sso.rule": "Host(`sso.${DOMAIN}`)"
      "traefik.http.routers.sso.entrypoints": "websecure"
      "traefik.http.routers.sso.tls": "true"
      [[- if .ACMEEmail]]
      "traefik.http.routers.sso.tls.certresolver": "letsencrypt"
      [[- end]]
      "traefik.http.services.sso.loadbalancer.server.port": "4180"
      "traefik.http.routers.sso-pmcluster.rule": "Host(`pmcluster.${DOMAIN}`) && PathPrefix(`/oauth2`)"
      "traefik.http.routers.sso-pmcluster.entrypoints": "websecure"
      "traefik.http.routers.sso-pmcluster.tls": "true"
      [[- if .ACMEEmail]]
      "traefik.http.routers.sso-pmcluster.tls.certresolver": "letsencrypt"
      [[- end]]
      "traefik.http.routers.sso-pmcluster.priority": "1000"
      "traefik.http.routers.sso-pmcluster.service": "sso"
      "traefik.http.routers.sso-observ.rule": "Host(`observ.${DOMAIN}`) && PathPrefix(`/oauth2`)"
      "traefik.http.routers.sso-observ.entrypoints": "websecure"
      "traefik.http.routers.sso-observ.tls": "true"
      [[- if .ACMEEmail]]
      "traefik.http.routers.sso-observ.tls.certresolver": "letsencrypt"
      [[- end]]
      "traefik.http.routers.sso-observ.priority": "1000"
      "traefik.http.routers.sso-observ.service": "sso"
    secrets:
      - sso_cookie_secret