# backup-stack.yml — backup agents + the in-cluster SeaweedFS backup store (DSL
# manifest, platform-managed). Rendered by LoadComposeFile through the same
# manifest pipeline as customer app stacks.
app: backup
env: production
domain: ${DOMAIN}
platform: true
[[ if .Store.Enabled ]]
volumes:
  seaweeddata: ""
[[ end ]]
services:
  # The Backup Agent — one per node when backup_all_nodes is set; one per
  # STORAGE node (pmcluster.storage label) when the storage_nodes setting is
  # non-empty; otherwise a single replica pinned to the platform node / manager.
  # Writes each archive to the in-cluster SeaweedFS store via WebDAV (WEBDAV_*)
  # whenever the store is enabled, AND to the offsite S3 target (AWS_*) when
  # that is also configured. Store-only clusters use WebDAV only (the S3 API
  # does NOT auto-create the bucket — BUG-016); offsite-only clusters fall back
  # to a single S3 write.
  # The per-volume archiver that used to live here (offen/docker-volume-backup)
  # is gone from the binary. It tarred a live directory — one growing SQLite
  # file could abort a node's whole hour — and had no concept of a snapshot.
  # Stack data is archived by the node-local systemd unit instead
  # (pmcluster-backup.timer): freeze, snapshot, one verified artifact per stack,
  # ship to the store below, 15-day retention. This stack keeps only the store
  # and the control-plane archiver.

[[ if .Store.Enabled ]]
  # The in-cluster backup store. Runs on a NON-storage node via an explicit
  # placement (which bypasses the volumed-service→storage-node auto-pin), so
  # the durable copy lives in a different failure domain than the data.
  # SeaweedFS serves the S3 API on 8333; buckets auto-create on first upload
  # (no admin API, no layout). Credentials come from the AWS_ACCESS_KEY_ID /
  # AWS_SECRET_ACCESS_KEY env vars, which SeaweedFS auto-promotes to an admin
  # identity (verified — no config file needed). Port 8333 is published on the
  # routing mesh so the leader daemon can read backups at 127.0.0.1:8333 during
  # a failover restore. Data lives in a plain named volume (a real disk, never
  # tmpfs).
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    placement: "[[ if .Store.Node ]][[.Store.Node]][[ else if .BackupNode ]][[.BackupNode]][[ else if .LeaderNode ]][[.LeaderNode]][[ else ]]manager[[ end ]]"
    # Advertise loopback: publishing 8333 attaches the ingress network, whose
    # auto-detected task IP is not self-reachable, so the server must not
    # advertise it. Bind on all interfaces so the published 8333 keeps working.
    # 8333 IS published (on the routing mesh) because the backup agent is a HOST
    # process: it cannot resolve backup_seaweedfs on the overlay, so each node
    # ships its own artifacts to 127.0.0.1:8333 with the store's own S3 keys.
    command: ["server", "-s3", "-s3.port=8333", "-s3.port.iceberg=0", "-s3.port.lance=0", "-ip=127.0.0.1", "-ip.bind=0.0.0.0", "-s3.ip.bind=0.0.0.0"]
    restart: any
    # NOTE: this service runs with update order "stop-first" on the live cluster,
    # set out of band. SeaweedFS keeps its filer metadata in a LevelDB directory
    # that allows ONE writer; the default start-first rollout starts the
    # replacement while the old task still holds the lock, the new task exits 255
    # ("resource temporarily unavailable"), and the update pauses. The manifest
    # DSL cannot express update_config yet, so a `cluster update` will drop this
    # back to the default — worth modelling as `update: {order: stop-first}`.
    env:
      AWS_ACCESS_KEY_ID: "[[.Store.AccessKey]]"
      AWS_SECRET_ACCESS_KEY: "[[.Store.SecretKey]]"
    volumes:
      - seaweeddata:/data
    ports:
      - target: 8333
        published: 8333
      # WebDAV: reachable from every node's own loopback so the host agent can
      # ship artifacts without overlay DNS.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8333/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    resources:
      reservations:
        cpus: "0.1"
        memory: 128M
      limits:
        cpus: "0.5"
        memory: 512M
[[ end ]]
[[ if .DataDir ]]
  # The Control-Plane Backup Agent — runs ONLY on the manager node (where
  # ~/.pmcluster lives). Archives the pmcluster control plane itself so a lost
  # manager disk doesn't mean a full re-bootstrap. Distinct prefix + longer
  # retention.
  control-plane-backup:
    image: offen/docker-volume-backup:v2
    # The control plane lives on the LEADER (~/.pmcluster). This task must run
    # there: pinned anywhere else it archives an empty directory and produces a
    # backup that restores nothing. It was pinned to the store node, which is a
    # non-storage worker — so every "control-plane backup" since that placement
    # was a 9 KB archive of a worker's empty database.
    placement: "[[ if .LeaderNode ]][[.LeaderNode]][[ else if .BackupNode ]][[.BackupNode]][[ else ]]manager[[ end ]]"
    restart: any
    env:
      BACKUP_CRON_EXPRESSION: "0 3 * * *"
      BACKUP_FILENAME: "pmcluster-ctlplane-{{ .Node.ID }}-%Y-%m-%dT%H-%M-%S.tar.gz"
      BACKUP_SOURCES: "/backup/pmcluster"
      BACKUP_PRUNING_PREFIX: "pmcluster-ctlplane-"
      BACKUP_RETENTION_DAYS: "30"
      # ONE backend per process, offsite first. The two branches below describe
      # the same seven variables, so emitting both — which this template used to
      # do whenever the store AND an offsite bucket were configured — produced a
      # YAML mapping with duplicate keys, and every `cluster update` on such a
      # cluster died in the parser with the backup stack left at whatever was
      # deployed last. Offsite wins: the offsite copy is the one that survives
      # the node, and the store is ON the node.
      [[- if .BackupS3.Configured ]]
      AWS_S3_BUCKET_NAME: "[[.BackupS3.Bucket]]"
      AWS_ACCESS_KEY_ID: "[[.BackupS3.AccessKey]]"
      AWS_SECRET_ACCESS_KEY: "[[.BackupS3.SecretKey]]"
      AWS_ENDPOINT: "[[.BackupS3.EndpointHost]]"
      AWS_ENDPOINT_PROTO: "[[.BackupS3.EndpointProto]]"
      AWS_REGION: "[[.BackupS3.Region]]"
      AWS_S3_BUCKET_LOOKUP: "path"
      [[- else if .Store.Enabled ]]
      # The store is an S3 target, like any other destination. WebDAV was here
      # because the S3 API "does not auto-create a bucket" — SeaweedFS does, on
      # first upload, so that reason is gone and with it a whole second protocol.
      AWS_S3_BUCKET_NAME: "[[.Store.Bucket]]"
      AWS_ACCESS_KEY_ID: "[[.Store.AccessKey]]"
      AWS_SECRET_ACCESS_KEY: "[[.Store.SecretKey]]"
      AWS_ENDPOINT: "backup_seaweedfs:8333"
      AWS_ENDPOINT_PROTO: "http"
      AWS_REGION: "us-east-1"
      AWS_S3_BUCKET_LOOKUP: "path"
      [[- end ]]
    binds:
      - "${DATA_DIR}:/backup/pmcluster:ro"
      - "[[.BackupDir]]:/archive"
      - "/etc/localtime:/etc/localtime:ro"
    resources:
      reservations:
        cpus: "0.05"
        memory: 32M
      limits:
        cpus: "0.5"
        memory: 128M
[[ end ]]
