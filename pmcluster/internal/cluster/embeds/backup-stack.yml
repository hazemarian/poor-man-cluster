# backup-stack.yml — backup agents + the in-cluster SeaweedFS backup store (DSL
# manifest, platform-managed). Rendered by LoadComposeFile through the same
# manifest pipeline as customer app stacks.
app: backup
env: production
domain: ${DOMAIN}
platform: true
[[ if .Store.Enabled ]]
volumes:
  seaweeddata: ""
[[ end ]]
services:
  # The Backup Agent — one per node when backup_all_nodes is set; one per
  # STORAGE node (pmcluster.storage label) when the storage_nodes setting is
  # non-empty; otherwise a single replica pinned to the platform node / manager.
  # Writes each archive to BOTH the offsite S3 target (AWS_*) and the
  # in-cluster SeaweedFS store (WebDAV, WEBDAV_*) when the store AND offsite are
  # configured; store-only and offsite-only fall back to a single S3 write.
  volume-backup:
    image: offen/docker-volume-backup:v2
[[ if .BackupAllNodes ]]
    mode: global
[[ else if .StorageNodeConstraint ]]
    mode: global
    constraints:
      - "node.labels.[[.StorageNodeLabel]] == true"
[[ else ]]
    replicas: 1
    placement: "[[ if .PlatformNode ]][[.PlatformNode]][[ else ]]manager[[ end ]]"
[[ end ]]
    restart: on-failure
    env:
      BACKUP_CRON_EXPRESSION: "[[ if .BackupCron ]][[.BackupCron]][[ else ]]0 * * * *[[ end ]]"
      BACKUP_FILENAME: "backup-{{ .Node.ID }}-%Y-%m-%dT%H-%M-%S.tar.gz"
      BACKUP_PRUNING_PREFIX: "backup-"
      BACKUP_RETENTION_DAYS: "[[ if .BackupRetentionDays ]][[.BackupRetentionDays]][[ else ]]15[[ end ]]"
      [[- if .Store.Enabled ]]
      [[- if .BackupS3.Configured ]]
      # Double-write: offsite S3 + in-cluster store via WebDAV. offen's native
      # pruning keeps BOTH copies in lockstep (no separate replicator needed).
      AWS_S3_BUCKET_NAME: "[[.BackupS3.Bucket]]"
      AWS_ACCESS_KEY_ID: "[[.BackupS3.AccessKey]]"
      AWS_SECRET_ACCESS_KEY: "[[.BackupS3.SecretKey]]"
      AWS_ENDPOINT: "[[.BackupS3.EndpointHost]]"
      AWS_ENDPOINT_PROTO: "[[.BackupS3.EndpointProto]]"
      AWS_REGION: "[[.BackupS3.Region]]"
      AWS_S3_FORCE_PATH_STYLE: "true"
      WEBDAV_URL: "http://backup_seaweedfs:7333"
      WEBDAV_PATH: "/buckets/[[.Store.Bucket]]"
      # offen refuses an anonymous WebDAV backend, so credentials must be set;
      # the SeaweedFS gateway does not check them, so the store's own keys are
      # reused here.
      WEBDAV_USERNAME: "[[.Store.AccessKey]]"
      WEBDAV_PASSWORD: "[[.Store.SecretKey]]"
      [[- else ]]
      AWS_S3_BUCKET_NAME: "[[.Store.Bucket]]"
      AWS_ACCESS_KEY_ID: "[[.Store.AccessKey]]"
      AWS_SECRET_ACCESS_KEY: "[[.Store.SecretKey]]"
      AWS_ENDPOINT: "[[.Store.Endpoint]]"
      AWS_ENDPOINT_PROTO: "http"
      AWS_REGION: "us-east-1"
      AWS_S3_FORCE_PATH_STYLE: "true"
      [[- end ]]
      [[- else if .BackupS3.Configured ]]
      AWS_S3_BUCKET_NAME: "[[.BackupS3.Bucket]]"
      AWS_ACCESS_KEY_ID: "[[.BackupS3.AccessKey]]"
      AWS_SECRET_ACCESS_KEY: "[[.BackupS3.SecretKey]]"
      AWS_ENDPOINT: "[[.BackupS3.Endpoint]]"
      AWS_REGION: "[[.BackupS3.Region]]"
      AWS_S3_FORCE_PATH_STYLE: "true"
      [[- end ]]
    binds:
      - "[[.VolumeRoot]]:/backup/data:ro"
      - "[[.BackupDir]]:/archive"
      - "/etc/localtime:/etc/localtime:ro"
[[ if .Store.Enabled ]]
  # The in-cluster backup store. Runs on a NON-storage node via an explicit
  # placement (which bypasses the volumed-service→storage-node auto-pin), so
  # the durable copy lives in a different failure domain than the data.
  # SeaweedFS serves the S3 API on 8333; buckets auto-create on first upload
  # (no admin API, no layout). Credentials come from the AWS_ACCESS_KEY_ID /
  # AWS_SECRET_ACCESS_KEY env vars, which SeaweedFS auto-promotes to an admin
  # identity (verified — no config file needed). Port 8333 is published on the
  # routing mesh so the leader daemon can read backups at 127.0.0.1:8333 during
  # a failover restore. Data lives in a plain named volume (a real disk, never
  # tmpfs).
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    placement: "[[ if .Store.Node ]][[.Store.Node]][[ else if .PlatformNode ]][[.PlatformNode]][[ else ]]manager[[ end ]]"
    # Advertise loopback: publishing 8333 attaches the ingress network, whose
    # auto-detected task IP is not self-reachable, so the server must not
    # advertise it. Bind on all interfaces so the published 8333 keeps working.
    # The WebDAV gateway (offen's second write target) runs in THIS process via
    # `-webdav`, so it shares the container's network namespace and reaches the
    # filer on loopback — no separate container, no cross-container loopback
    # problem. It serves the SAME namespace as S3 (bucket pmcluster-backups ==
    # filer /buckets/pmcluster-backups). Cluster-internal: no published port.
    command: ["server", "-s3", "-s3.port=8333", "-s3.port.iceberg=0", "-s3.port.lance=0", "-webdav", "-webdav.port=7333", "-ip=127.0.0.1", "-ip.bind=0.0.0.0", "-s3.ip.bind=0.0.0.0"]
    restart: on-failure
    env:
      AWS_ACCESS_KEY_ID: "[[.Store.AccessKey]]"
      AWS_SECRET_ACCESS_KEY: "[[.Store.SecretKey]]"
    volumes:
      - seaweeddata:/data
    ports:
      - target: 8333
        published: 8333
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8333/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
[[ end ]]
[[ if .DataDir ]]
  # The Control-Plane Backup Agent — runs ONLY on the manager node (where
  # ~/.pmcluster lives). Archives the pmcluster control plane itself so a lost
  # manager disk doesn't mean a full re-bootstrap. Distinct prefix + longer
  # retention.
  control-plane-backup:
    image: offen/docker-volume-backup:v2
    placement: "[[ if .PlatformNode ]][[.PlatformNode]][[ else ]]manager[[ end ]]"
    restart: on-failure
    env:
      BACKUP_CRON_EXPRESSION: "0 3 * * *"
      BACKUP_FILENAME: "pmcluster-ctlplane-{{ .Node.ID }}-%Y-%m-%dT%H-%M-%S.tar.gz"
      BACKUP_SOURCES: "/backup/pmcluster"
      BACKUP_PRUNING_PREFIX: "pmcluster-ctlplane-"
      BACKUP_RETENTION_DAYS: "30"
      [[- if .Store.Enabled ]]
      [[- if .BackupS3.Configured ]]
      AWS_S3_BUCKET_NAME: "[[.BackupS3.Bucket]]"
      AWS_ACCESS_KEY_ID: "[[.BackupS3.AccessKey]]"
      AWS_SECRET_ACCESS_KEY: "[[.BackupS3.SecretKey]]"
      AWS_ENDPOINT: "[[.BackupS3.EndpointHost]]"
      AWS_ENDPOINT_PROTO: "[[.BackupS3.EndpointProto]]"
      AWS_REGION: "[[.BackupS3.Region]]"
      AWS_S3_FORCE_PATH_STYLE: "true"
      WEBDAV_URL: "http://backup_seaweedfs:7333"
      WEBDAV_PATH: "/buckets/[[.Store.Bucket]]"
      # offen refuses an anonymous WebDAV backend, so credentials must be set;
      # the SeaweedFS gateway does not check them, so the store's own keys are
      # reused here.
      WEBDAV_USERNAME: "[[.Store.AccessKey]]"
      WEBDAV_PASSWORD: "[[.Store.SecretKey]]"
      [[- else ]]
      AWS_S3_BUCKET_NAME: "[[.Store.Bucket]]"
      AWS_ACCESS_KEY_ID: "[[.Store.AccessKey]]"
      AWS_SECRET_ACCESS_KEY: "[[.Store.SecretKey]]"
      AWS_ENDPOINT: "[[.Store.Endpoint]]"
      AWS_ENDPOINT_PROTO: "http"
      AWS_REGION: "us-east-1"
      AWS_S3_FORCE_PATH_STYLE: "true"
      [[- end ]]
      [[- else if .BackupS3.Configured ]]
      AWS_S3_BUCKET_NAME: "[[.BackupS3.Bucket]]"
      AWS_ACCESS_KEY_ID: "[[.BackupS3.AccessKey]]"
      AWS_SECRET_ACCESS_KEY: "[[.BackupS3.SecretKey]]"
      AWS_ENDPOINT: "[[.BackupS3.Endpoint]]"
      AWS_REGION: "[[.BackupS3.Region]]"
      AWS_S3_FORCE_PATH_STYLE: "true"
      [[- end ]]
    binds:
      - "${DATA_DIR}:/backup/pmcluster:ro"
      - "[[.BackupDir]]:/archive"
      - "/etc/localtime:/etc/localtime:ro"
[[ end ]]
