{{define "terminal"}}
<!doctype html>
<html lang="{{LANG}}" dir="{{DIR}}" data-theme="{{THEME}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="robots" content="noindex">
  <link rel="icon" href="{{static "favicon.svg"}}" type="image/svg+xml">
  <title>{{T "terminal.title"}} · {{T "app.title"}}</title>
  <script>
    // Applied before first paint so the terminal matches the saved theme.
    (function () {
      try {
        var t = localStorage.getItem('pmc_theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="{{static "fonts.css"}}">
  <link rel="stylesheet" href="{{static "base.css"}}">
  <link rel="stylesheet" href="{{static "components.css"}}">
  <link rel="stylesheet" href="{{static "patterns.css"}}">
  <link rel="stylesheet" href="{{static "xterm.css"}}">
  <script src="{{static "xterm.min.js"}}" defer></script>
  <script src="{{static "preferences.js"}}" defer></script>
</head>
<body class="terminal-body">
<main class="terminal-doc">
  <header class="terminal-bar">
    <a class="terminal-back" href="{{WebBase}}/stacks/{{.Stack}}" data-tip="{{T "terminal.back"}}">{{icon "arrow-left"}} {{T "terminal.back"}}</a>
    <span class="terminal-heading mono iso" dir="ltr">{{.Stack}} / {{.Service}}</span>
    <span class="terminal-version muted num" dir="ltr">{{.Version}}</span>
  </header>
  <div id="term" class="terminal-host"></div>
  <div id="term-status" class="terminal-status muted" hidden></div>
</main>

<script>
// WAIT FOR THE DEFERRED SCRIPTS. xterm.min.js and preferences.js are loaded with `defer`, which
// means they execute AFTER the document is parsed — later than this inline block, which sits at the
// end of <body> and runs immediately. Reading window.Terminal here always found undefined, showed
// "the terminal failed to load", and never opened the websocket: the page rendered, the server saw
// the page request, and no handshake ever arrived. Deferred scripts run before DOMContentLoaded, so
// that is the correct place to start.
document.addEventListener('DOMContentLoaded', function () {
  "use strict";

  var ws = null;
  var term = null;
  var termEl = document.getElementById('term');
  var statusEl = document.getElementById('term-status');

  function setStatus(msg, bad) {
    statusEl.textContent = msg;
    statusEl.hidden = !msg;
    statusEl.classList.toggle('bad', !!bad);
  }

  function sendResize() {
    if (ws && ws.readyState === WebSocket.OPEN && term) {
      ws.send(JSON.stringify({type: 'resize', rows: term.rows, cols: term.cols}));
    }
  }

  // Fit the terminal to its container: compute cols/rows from the host box
  // using the current character cell size, then tell both xterm and the
  // server (via a resize control frame).
  function fit() {
    if (!term) return;
    var w = termEl.clientWidth, h = termEl.clientHeight;
    if (!w || !h) return;
    var dims = term._core ? term._core._renderService.dimensions : null;
    if (!dims || !dims.actualCellWidth || !dims.actualCellHeight) return;
    var cols = Math.max(2, Math.floor(w / dims.actualCellWidth));
    var rows = Math.max(1, Math.floor(h / dims.actualCellHeight));
    term.resize(cols, rows);
    sendResize();
  }

  function connect() {
    // The server renders the correct ws/wss URL for the current request.
    // html/template already knows this is a JS string context and quotes+escapes the value.
    // Wrapping it in printf "%q" as well double-quoted it, so the browser received a URL that
    // began with a literal quote, refused it as invalid, and reported "could not start the
    // terminal session" without ever sending a request.
    var url = {{.WSURL}};
    if (!/^wss?:\/\//.test(url)) {
      url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + url;
    }
    ws = new WebSocket(url);
    ws.binaryType = 'arraybuffer';

    ws.onopen = function () { setStatus(''); setTimeout(fit, 30); };
    ws.onmessage = function (ev) {
      if (ev.data instanceof ArrayBuffer) {
        term.write(new Uint8Array(ev.data));
        return;
      }
      try {
        var msg = JSON.parse(ev.data);
        if (msg.type === 'error') {
          setStatus(msg.error || '{{T "terminal.failed"}}', true);
        } else if (msg.type === 'exit') {
          setStatus('{{T "terminal.exited"}} ' + msg.code, false);
        }
      } catch (e) {}
    };
    ws.onclose = function (ev) {
      // The code is the diagnosis: 1006 means the handshake never completed (a gate in front
      // of the console refused it, or the network dropped), while 1000/1001 is a normal end.
      // Without it "closed" is indistinguishable from "blocked".
      if (!statusEl.hidden) return;
      setStatus('{{T "terminal.closed"}}' + ' (' + ev.code + (ev.reason ? ': ' + ev.reason : '') + ')', true);
    };
    ws.onerror = function (ev) {
      setStatus('{{T "terminal.failed"}}', true);
      // Tell the console what the BROWSER saw: without this the server log is silent about a
      // handshake that died on this side, and "Could not start the terminal session" is the only
      // evidence anyone has.
      try {
        navigator.sendBeacon(
          {{.ReportURL}},
          new Blob([JSON.stringify({
            url: url, readyState: ws.readyState, location: location.href,
            secure: window.isSecureContext, ts: Date.now()
          })], {type: 'application/json'})
        );
      } catch (e) {}
    };
  }

  if (!window.Terminal) {
    setStatus('{{T "terminal.load_failed"}}', true);
    return;
  }

  term = new Terminal({
    convertEol: true,
    cursorBlink: true,
    fontSize: 13,
    scrollback: 5000,
    fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace',
    theme: { background: '#0d1117', foreground: '#e6edf3' }
  });
  term.open(termEl);
  term.onData(function (data) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(data);
  });
  term.onResize(function () { sendResize(); });
  window.addEventListener('resize', function () { fit(); });

  connect();
});
</script>
</body>
</html>
{{end}}
