{{define "secretreveal"}}
{{if .Error}}<div class="msg err">{{.Error}}</div>{{end}}
<h2>Secret · <code>{{.Name}}</code></h2>
<p class="sub">The value is decrypted on demand. Handle it like a password.</p>
<pre id="secret-value" style="white-space:pre-wrap">{{.Value}}</pre>
<div class="row">
  <button class="btn" data-copy="{{.Value}}" onclick="copyVal(this)">Copy value</button>
  <button type="button" class="btn ghost" onclick="closeModal()">Close</button>
</div>
{{end}}
