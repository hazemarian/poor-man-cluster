{{define "secretform"}}
{{if .Error}}<div class="msg err">{{.Error}}</div>{{end}}
<h2>{{if .IsEdit}}Edit secret{{else}}Add secret{{end}}</h2>
{{if .IsEdit}}<p class="sub">Editing <code>{{.Name}}</code> replaces its stored value.</p>{{end}}
<form hx-post="{{.Action}}" hx-target="#view" hx-swap="innerHTML" hx-on::after-request="if(!event.detail.failed) closeModal()">
  <label>Name</label>
  {{if .IsEdit}}
  <input type="hidden" name="name" value="{{.Name}}">
  <p class="muted"><code>{{.Name}}</code></p>
  {{else}}
  <input name="name" value="{{.Name}}" placeholder="my_secret" required autofocus>
  {{end}}
  <label>Value</label>
  <textarea name="value" rows="3" style="white-space:pre" required {{if .IsEdit}}placeholder="New value — replaces the stored one"{{end}}></textarea>
  <div class="row">
    <button class="btn" hx-disabled-elt="this">{{if .IsEdit}}Save{{else}}Create secret{{end}}</button>
    <button type="button" class="btn ghost" onclick="closeModal()">Cancel</button>
  </div>
</form>
{{end}}
