{{define "userform"}}
{{if .Error}}<div class="msg err">{{.Error}}</div>{{end}}

<h2 style="margin-top:0">{{if .IsEdit}}Edit user {{.Username}}{{else}}New user{{end}}</h2>
<form hx-post="{{.Action}}" hx-target="#view" hx-swap="innerHTML" hx-on::after-request="if(!event.detail.failed)closeModal()">
  {{if .IsEdit}}<input type="hidden" name="id" value="{{.ID}}">{{end}}
  <label>Username</label>
  <input type="text" name="username" value="{{.Username}}" {{if .IsEdit}}disabled{{end}} required>
  <label>Role</label>
  <select name="role">
    <option value="admin"{{if eq .Role "admin"}} selected{{end}}>admin</option>
    <option value="operator"{{if eq .Role "operator"}} selected{{end}}>operator</option>
    <option value="viewer"{{if eq .Role "viewer"}} selected{{end}}>viewer</option>
  </select>
  {{if .IsEdit}}
  <label>Reset password <span class="muted">(leave blank to keep the current password)</span></label>
  <input type="password" name="password" placeholder="••••••••">
  {{else}}
  <label>Password</label>
  <input type="password" name="password" placeholder="at least 8 characters" required>
  {{end}}
  <div class="row">
    <button class="btn" type="submit" hx-disabled-elt="this">{{if .IsEdit}}Save{{else}}Create user{{end}}</button>
    <button class="btn ghost" type="button" onclick="closeModal()">Cancel</button>
  </div>
</form>
{{end}}
