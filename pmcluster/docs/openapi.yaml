  # ---------------------------------------------------------------------------
  # Public, unauthenticated badge endpoints. GitHub's camo proxy and image
  # widgets fetch these; GET and HEAD are both registered with the same handler.
  # ---------------------------------------------------------------------------
  /api/public/badge/{stack}:
    get:
      summary: Aggregate health badge for a stack (SVG)
      operationId: stackBadge
      security: []
      parameters:
        - name: stack
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: SVG badge
          content:
            image/svg+xml:
              schema:
                type: string
    head:
      summary: Same as GET, headers only
      operationId: stackBadgeHead
      security: []
      parameters:
        - name: stack
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: SVG badge headers, no body
  /api/public/badge/{stack}/services:
    get:
      summary: Per-service health badges for a stack (SVG)
      operationId: stackServicesBadge
      security: []
      parameters:
        - name: stack
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: SVG badge strip, one segment per service
          content:
            image/svg+xml:
              schema:
                type: string
    head:
      summary: Same as GET, headers only
      operationId: stackServicesBadgeHead
      security: []
      parameters:
        - name: stack
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: SVG badge headers, no body
  /api/public/badge/{stack}/{service}:
    get:
      summary: Health badge for one service (SVG)
      operationId: serviceBadge
      security: []
      parameters:
        - name: stack
          in: path
          required: true
          schema:
            type: string
        - name: service
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: SVG badge
          content:
            image/svg+xml:
              schema:
                type: string
    head:
      summary: Same as GET, headers only
      operationId: serviceBadgeHead
      security: []
      parameters:
        - name: stack
          in: path
          required: true
          schema:
            type: string
        - name: service
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: SVG badge headers, no body
  /api/services/{stack}/{service}/exec/ws:
    get:
      summary: Interactive exec over a websocket
      description: |
        The console's terminal. Dispatched outside the chi middleware chain
        because a websocket upgrade needs a real http.ResponseWriter
        (http.Hijacker); authentication is the same Bearer token and stack-scope
        guard as the REST routes. Frames carry terminal I/O; this is NOT the
        non-interactive `POST .../exec` (which answers JSON).
      operationId: execServiceWS
      security:
        - bearerAuth: []
      parameters:
        - name: stack
          in: path
          required: true
          schema:
            type: string
        - name: service
          in: path
          required: true
          schema:
            type: string
        - name: cmd
          in: query
          description: Command to run, space-separated; defaults to /bin/sh.
          schema:
            type: string
        - name: rows
          in: query
          schema:
            type: integer
        - name: cols
          in: query
          schema:
            type: integer
      responses:
        "101":
          description: Switching protocols — raw terminal byte frames follow
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Token scoped to another stack
        "501":
          description: Interactive exec unavailable on the answering node
  /api/mcp:
    post:
      summary: Model Context Protocol endpoint (streamable HTTP)
      description: |
        JSON-RPC 2.0 over HTTP, served by the daemon itself under the same
        Bearer token: every MCP tool call re-enters these routes in-process, so
        the handlers, the stack-scope guard and the roles above apply unchanged.
        The tool catalog is derived from this document (`operationId` per tool,
        input schema from the operation's parameters and request body), which is
        why it cannot describe an endpoint that does not exist.

        The tier served is chosen by the operator (`PMCLUSTER_MCP_ALLOW`):
        `read` by default, `write`, or `dangerous`. A call above the enabled
        tier is answered with a `manual_action_required` payload naming the
        command a human must run instead — bootstrap operations (cluster up,
        join, reset) have no API route and are only ever answered that way.
      operationId: mcpEndpoint
      security:
        - bearerAuth: []
      requestBody:
        required: true
        description: One JSON-RPC message (initialize, tools/list, tools/call).
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: JSON-RPC response, or an SSE stream when the client accepts text/event-stream
        "401":
          description: Missing or invalid bearer token
    get:
      summary: MCP server-to-client event stream
      operationId: mcpEventStream
      security:
        - bearerAuth: []
      responses:
        "200":
          description: SSE stream for the session named by Mcp-Session-Id
        "401":
          description: Missing or invalid bearer token
    delete:
      summary: End an MCP session
      operationId: mcpSessionClose
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Session terminated
        "401":
          description: Missing or invalid bearer token
  /api/nodes/{hostname}/storage:
    post:
      summary: Register a node as a storage node
      description: |
        Adds the node to the `storage_nodes` cluster setting and stamps the
        `pmcluster.storage` Swarm node label. Stateful stacks without an
        explicit placement may then land on it, and the backup agent runs a
        global task there.
      operationId: markStorageNode
      security:
        - bearerAuth: []
      parameters:
        - name: hostname
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Node registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageNodeResult"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Remove a node's storage designation
      description: |
        Removes the node from `storage_nodes` and clears the label. Stacks
        already pinned to it are NOT moved; use `POST /api/stacks/{name}/move`.
      operationId: unmarkStorageNode
      security:
        - bearerAuth: []
      parameters:
        - name: hostname
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Node no longer a storage node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageNodeResult"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/stacks/{name}/ack:
    post:
      summary: Acknowledge an open failover marker
      operationId: ackStackFailover
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Failover acknowledged; the stack's badge returns to normal
          content:
            application/json:
              schema:
                type: object
                properties:
                  stack:
                    type: string
                  acknowledged:
                    type: boolean
        "404":
          description: No open failover marker for that stack
  /api/stacks/{name}/move:
    post:
      summary: Move a stack's pinned services to another node
      description: |
        Re-renders and redeploys the stack with its stateful services pinned to
        `target`. The operator is responsible for the volume having moved.
      operationId: moveStack
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target]
              properties:
                target:
                  type: string
                  description: Destination node hostname
      responses:
        "200":
          description: Stack moved
          content:
            application/json:
              schema:
                type: object
                properties:
                  stack:
                    type: string
                  moved_to:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/configs/{name}/stack:
    put:
      summary: Reassign a config's scope and owning stack
      description: Binds a config created at the wrong scope to a stack (or back to cluster scope).
      operationId: retagConfig
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  type: string
                  enum: [cluster, service]
                  default: service
                stack:
                  type: string
                  description: Only valid with service scope; empty detaches the stack
      responses:
        "200":
          description: Config reassigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Retagged"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/secrets/{name}/stack:
    put:
      summary: Reassign a secret's scope and owning stack
      description: Binds a secret created at the wrong scope to a stack (or back to cluster scope).
      operationId: retagSecret
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  type: string
                  enum: [cluster, service]
                  default: service
                stack:
                  type: string
      responses:
        "200":
          description: Secret reassigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Retagged"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: pmc_<token_id>_<secret>
  parameters:
    EvidenceStart:
      name: start
      in: query
      required: false
      description: Window start (RFC3339). Must be sent with `end`.
      schema:
        type: string
        format: date-time
    EvidenceEnd:
      name: end
      in: query
      required: false
      description: Window end (RFC3339). Must be sent with `start`.
      schema:
        type: string
        format: date-time
    EvidenceRange:
      name: range
      in: query
      required: false
      description: Shorthand window ("15m", "1h"). `window` is accepted as an alias. Ignored when start/end are sent.
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Internal error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
    Health:
      type: object
      properties:
        status:
          type: string
        version:
          type: string
        commit:
          type: string
    Me:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    DeployPayload:
      type: object
      properties:
        app_name:
          type: string
        repo_url:
          type: string
        version:
          type: string
        manifest:
          type: string
      required:
        - manifest
    DeployResult:
      type: object
      properties:
        status:
          type: string
          enum: [accepted]
          description: present on the 202 deploy response
        stack:
          type: string
        revision:
          type: integer
          format: int64
    RollbackResult:
      type: object
      properties:
        stack:
          type: string
        new_revision:
          type: integer
          format: int64
        rolled_back_to:
          type: integer
          format: int64
    SyncResult:
      type: object
      properties:
        stack:
          type: string
        revision:
          type: integer
          format: int64
        changed:
          type: boolean
          description: false when the re-render matched the stored rendered_hash (no-op)
    WebhookDelivery:
      type: object
      properties:
        id:
          type: integer
          format: int64
        source:
          type: string
        status:
          type: string
        stack_name:
          type: string
        revision:
          type: integer
          format: int64
        repo_url:
          type: string
        file:
          type: string
        error:
          type: string
        retries:
          type: integer
          description: extra deploy attempts made after a transient failure
        created_at:
          type: integer
          format: int64
    BackupFile:
      type: object
      properties:
        path:
          type: string
        size:
          type: integer
          format: int64
          description: -1 when the archive path is missing on disk
        is_dir:
          type: boolean
    Usage:
      type: object
      properties:
        configs:
          type: object
          description: Docker config name -> stacks referencing it
          additionalProperties:
            type: array
            items:
              type: string
        secrets:
          type: object
          description: Swarm secret name -> stacks referencing it
          additionalProperties:
            type: array
            items:
              type: string
    ClusterInfo:
      type: object
      properties:
        node_name:
          type: string
        server_version:
          type: string
        os:
          type: string
        arch:
          type: string
        cpus:
          type: integer
        memory_bytes:
          type: integer
          format: int64
        swarm:
          $ref: "#/components/schemas/SwarmInfo"
    SwarmInfo:
      type: object
      properties:
        state:
          type: string
        control_available:
          type: boolean
        managers:
          type: integer
        nodes:
          type: integer
    Node:
      type: object
      properties:
        id:
          type: string
        hostname:
          type: string
        role:
          type: string
          enum: [manager, worker]
        availability:
          type: string
          description: active, or drain/draining when the node refuses new work
        status:
          type: string
          description: ready, or the engine's own not-ready label
        is_leader:
          type: boolean
        engine_version:
          type: string
        address:
          type: string
        storage:
          type: boolean
          description: node is registered as a storage node (pmcluster.storage label)
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64
    Stack:
      type: object
      properties:
        name:
          type: string
        current_revision:
          type: integer
          format: int64
        repo_url:
          type: string
        source_file:
          type: string
        last_error:
          type: string
          description: error from the most recent failed background deploy
        failover:
          type: object
          description: open failover marker, when the stack was moved after a storage-node failure
          additionalProperties: true
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64
    StackDetail:
      type: object
      properties:
        stack:
          $ref: "#/components/schemas/Stack"
        revisions:
          type: array
          items:
            type: object
            properties:
              revision:
                type: integer
                format: int64
              created_at:
                type: integer
                format: int64
              error:
                type: string
                description: why this revision failed to apply; empty when it applied
        last_backup:
          $ref: "#/components/schemas/BackupSummary"
    BackupSummary:
      type: object
      properties:
        status:
          type: string
        started_at:
          type: integer
          format: int64
        finished_at:
          type: integer
          format: int64
        revision:
          type: integer
          format: int64
        error_message:
          type: string
    Revision:
      type: object
      properties:
        stack:
          type: string
        revision:
          type: integer
          format: int64
        created_at:
          type: integer
          format: int64
        source_yaml:
          type: string
        rendered_yaml:
          type: string
        payload:
          type: string
        error:
          type: string
          description: why this revision failed to apply; empty when it applied
    Backup:
      type: object
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
        stack_name:
          type: string
        revision:
          type: integer
          format: int64
        archive_paths:
          type: array
          items:
            type: string
        error_message:
          type: string
        started_at:
          type: integer
          format: int64
        finished_at:
          type: integer
          format: int64
    HostCert:
      type: object
      properties:
        host:
          type: string
        sans:
          type: array
          items:
            type: string
        not_after:
          type: string
          format: date-time
        not_before:
          type: string
          format: date-time
        cert_secret:
          type: string
        key_secret:
          type: string
        cert_hash:
          type: string
        key_hash:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SiteCert:
      type: object
      properties:
        domain:
          type: string
        cert_secret:
          type: string
        key_secret:
          type: string
        not_before:
          type: string
          format: date-time
        not_after:
          type: string
          format: date-time
        sans:
          type: array
          items:
            type: string
        cert_hash:
          type: string
        key_hash:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Webhook:
      type: object
      properties:
        source:
          type: string
        description:
          type: string
        created_at:
          type: integer
          format: int64
        last_used_at:
          type: integer
          format: int64
    WebhookCreated:
      type: object
      properties:
        source:
          type: string
        secret:
          type: string
    APIKey:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        stack:
          type: string
        created_at:
          type: integer
          format: int64
        last_used_at:
          type: integer
          format: int64
    APIKeyCreated:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        stack:
          type: string
          description: Stack scope that was requested ("" = unscoped).
        token:
          type: string
    Secret:
      type: object
      properties:
        id:
          type: integer
          format: int64
        scope:
          type: string
          enum: [cluster, service]
        stack:
          type: string
        name:
          type: string
        hash:
          type: string
        created_at:
          type: integer
          format: int64
        swarm_rev:
          type: integer
          format: int64
          description: swarm object revision versioning this secret
    Config:
      type: object
      description: One config including its content (GET /api/configs/{name}).
      properties:
        id:
          type: integer
          format: int64
        scope:
          type: string
          enum: [cluster, service]
        name:
          type: string
        kind:
          type: string
          enum: [template, file, env]
        version:
          type: string
        hash:
          type: string
        content:
          type: string
    ConfigVersion:
      type: object
      properties:
        id:
          type: integer
          format: int64
        hash:
          type: string
        created_at:
          type: integer
          format: int64
    Service:
      type: object
      properties:
        name:
          type: string
          description: full swarm service name (stack_service)
        stack:
          type: string
          description: stack namespace from the com.docker.stack.namespace label; empty for unstacked services
        replicas:
          type: integer
          format: int64
          description: currently running tasks
        desired:
          type: integer
          format: int64
          description: desired replicas (global services report running tasks)
        image:
          type: string
        mode:
          type: string
          enum: [replicated, global]
        run_once:
          type: boolean
          description: run-once workload; zero running replicas means completed, not crashed
        image_created:
          type: integer
          format: int64
        update_state:
          type: string
          description: swarm update state (updating, paused, completed, rollback_started, ...)
        update_error:
          type: string
        updated:
          type: integer
          format: int64
          description: last service spec update (unix seconds)
        node:
          type: string
          description: where the platform asked the service to run (a pin)
        running_node:
          type: string
          description: where it actually runs; differs from node when it drifted
        platform:
          type: boolean
          description: platform-managed service (ingress, console, backup, ...)
    ServiceTask:
      type: object
      properties:
        task_id:
          type: string
        node:
          type: string
          description: swarm node hostname running the task
        slot:
          type: integer
          format: int64
        state:
          type: string
          description: swarm task state (running, failed, rejected, shutdown, ...)
        error:
          type: string
          description: task error message, when failed/rejected
        started_at:
          type: integer
          format: int64
        finished_at:
          type: integer
          format: int64
    ServiceLogLine:
      type: object
      properties:
        stream:
          type: string
          enum: [stdout, stderr]
        line:
          type: string
    ExecResult:
      type: object
      properties:
        service:
          type: string
        exit_code:
          type: integer
        stdout:
          type: string
        stderr:
          type: string
    ConfigSummary:
      type: object
      description: One row of the config listing — metadata and hash, never content.
      properties:
        id:
          type: integer
          format: int64
        scope:
          type: string
          enum: [cluster, service]
        stack:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [template, file, env]
        version:
          type: string
        hash:
          type: string
        rendered:
          type: boolean
          description: a rendered variant exists for this config
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64
    ConfigCreated:
      type: object
      properties:
        id:
          type: integer
          format: int64
        scope:
          type: string
        stack:
          type: string
        name:
          type: string
        kind:
          type: string
        hash:
          type: string
    SecretCreated:
      type: object
      properties:
        id:
          type: integer
          format: int64
        scope:
          type: string
        stack:
          type: string
        name:
          type: string
        hash:
          type: string
    BackupStarted:
      type: object
      description: |
        A backup that has already run to completion on the node answering the
        call (the daemon does not return a run id that is still in flight).
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
        archive_paths:
          type: array
          items:
            type: string
    StorageNodeResult:
      type: object
      properties:
        hostname:
          type: string
        storage:
          type: boolean
        storage_nodes:
          type: array
          items:
            type: string
    Retagged:
      type: object
      properties:
        name:
          type: string
        scope:
          type: string
          enum: [cluster, service]
        stack:
          type: string
    UpdateResult:
      type: object
      description: What `cluster update` re-applied. Absent fields mean the step was skipped.
      properties:
        otel_config:
          type: string
        traefik_config:
          type: string
        cert_secret:
          type: string
        key_secret:
          type: string
        edge_config:
          type: string
        stacks_deployed:
          type: array
          items:
            type: string
        configs_changed:
          type: array
          items:
            type: string
    ObservabilityWindow:
      type: object
      description: The window every observability read was answered over.
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
    ObservabilityNode:
      type: object
      properties:
        id:
          type: string
        hostname:
          type: string
        role:
          type: string
        availability:
          type: string
        swarm_status:
          type: string
        is_leader:
          type: boolean
        telemetry_status:
          type: string
          enum: [available, unavailable, stale]
        last_seen:
          type: string
          format: date-time
    ObservabilityStatus:
      type: object
      description: |
        Inventory coverage compared with telemetry. `empty`, `missing`, `stale`
        and `inventory_failed` are distinct values, not shades of "unavailable".
      properties:
        status:
          type: string
          enum: [available, unavailable, stale, empty, missing, inventory_failed]
        inventory_status:
          type: string
        telemetry_status:
          type: string
        observed_at:
          type: string
          format: date-time
        window:
          $ref: "#/components/schemas/ObservabilityWindow"
        expected_nodes:
          type: integer
        reporting_nodes:
          type: integer
        unknown_node_samples:
          type: integer
        truncated:
          type: boolean
        truncation_reasons:
          type: array
          items:
            type: string
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/ObservabilityNode"
    ObservabilityEvidence:
      type: object
      description: |
        Bounded read envelope shared by logs, traces, metrics and volume. A row
        shape differs per endpoint (log line, span, bucket sample), so rows are
        documented as opaque objects rather than per-endpoint unions.
      properties:
        status:
          type: string
          enum: [available, unavailable, stale]
        observed_at:
          type: string
          format: date-time
        window:
          $ref: "#/components/schemas/ObservabilityWindow"
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
        truncated:
          type: boolean
        truncation_reasons:
          type: array
          items:
            type: string
        coverage:
          type: string
        error:
          type: string
    ObservabilityServiceNames:
      type: object
      properties:
        status:
          type: string
          enum: [available, unavailable]
        window:
          $ref: "#/components/schemas/ObservabilityWindow"
        services:
          type: array
          items:
            type: string
        error:
          type: string
