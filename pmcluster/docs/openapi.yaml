openapi: 3.0.3
info:
  title: pmcluster daemon API
  description: |
    REST + webhook API for the pmcluster Docker Swarm control plane.

    All `/api/*` routes require a Bearer token (an API user; see `POST /api/api_keys`
    to mint one). The webhook receiver `/webhook/{source}` is intentionally NOT
    Bearer-authenticated — its auth is an HMAC-SHA256 signature computed over the
    (timestamp + body) with the source's shared secret. API users are minted with
    `pmcluster user create` or `POST /api/api_keys`; webhook sources with
    `pmcluster webhook add` or `POST /api/webhooks`.
  version: "0.2.0"
servers:
  - url: https://pmcluster.example.com
    description: Deployed daemon behind the edge gateway
  - url: http://127.0.0.1:PORT
    description: Local `pmcluster serve`
paths:
  /health:
    get:
      summary: Liveness probe (unauthenticated, no dependencies)
      operationId: health
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /webhook/{source}:
    post:
      summary: Accept an HMAC-verified deploy from CI
      description: |
        Unauthenticated by bearer. Mutually authenticated by the HMAC signature.
        Signature is HMAC-SHA256 over `<unix-seconds> + <json-body>` using the
        source's shared secret, sent as `sha256=<hex>`.
      operationId: webhookDeploy
      security: []
      parameters:
        - name: source
          in: path
          required: true
          schema:
            type: string
        - name: X-Pmcluster-Signature
          in: header
          required: true
          description: sha256=<hex-of-hmac>
          schema:
            type: string
        - name: X-Pmcluster-Timestamp
          in: header
          required: true
          description: Unix seconds; must be within 5 minutes of the server clock
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeployPayload"
      responses:
        "200":
          description: Deploy accepted and applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeployResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Bad or missing signature (indistinguishable from unknown source)
  /api/me:
    get:
      summary: Authenticated user profile
      operationId: me
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
  /api/cluster/info:
    get:
      summary: Node + swarm summary
      operationId: clusterInfo
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Node and swarm summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterInfo"
  /api/nodes:
    get:
      summary: List swarm nodes
      operationId: listNodes
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Swarm node list
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items:
                      $ref: "#/components/schemas/Node"
  /api/stacks:
    get:
      summary: List deployed stacks
      operationId: listStacks
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Stack list
          content:
            application/json:
              schema:
                type: object
                properties:
                  stacks:
                    type: array
                    items:
                      $ref: "#/components/schemas/Stack"
    post:
      summary: Deploy a manifest (create or update a stack)
      operationId: deploy
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeployPayload"
      responses:
        "200":
          description: Deploy accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeployResult"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/stacks/{name}:
    get:
      summary: One stack's metadata and recent revisions
      operationId: getStack
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stack detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StackDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Remove a deployed stack from the swarm and its record
      description: >-
        Removes the stack's services (`docker stack rm`), its named volumes and
        the Swarm secrets its services mount, then deletes the stack record
        along with its revisions and its service-scope configs/secrets.
      operationId: removeStack
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stack removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  stack:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/stacks/{name}/revisions/{rev}:
    get:
      summary: One revision's full source and rendered YAML
      operationId: getRevision
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: rev
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Revision detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Revision"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/stacks/{name}/rollback:
    post:
      summary: Roll a stack back to a prior revision
      operationId: rollback
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision]
              properties:
                revision:
                  type: integer
                  format: int64
      responses:
        "200":
          description: Rolled back
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RollbackResult"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/stacks/{name}/sync:
    post:
      summary: Re-apply a stack's stored manifest (k8s-style sync)
      description: |
        Re-translates the latest stored source manifest against the current
        DB configs/secrets and re-deploys when the rendered compose changed.
        When sha256(rendered) equals the latest revision's stored
        rendered_hash, this is a no-op (changed=false, no new revision, no
        Docker call).
      operationId: syncStack
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Synced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Stack not found
  /api/backups:
    get:
      summary: Recent backups across stacks
      operationId: listBackups
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Backup list
          content:
            application/json:
              schema:
                type: object
                properties:
                  backups:
                    type: array
                    items:
                      $ref: "#/components/schemas/Backup"
    post:
      summary: Trigger a cluster-wide backup
      operationId: createBackup
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Backup started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Backup"
  /api/stacks/{name}/backups:
    get:
      summary: Backups for one stack
      operationId: listStackBackups
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stack backup list
          content:
            application/json:
              schema:
                type: object
                properties:
                  backups:
                    type: array
                    items:
                      $ref: "#/components/schemas/Backup"
  /api/tls/site:
    get:
      summary: Get the cluster's own (default) certificate metadata
      description: |
        Returns metadata for the cluster's own-domain certificate (domain,
        secret names, validity window, SANs, hashes). The PEM bytes themselves
        live in versioned Swarm secrets and are never returned. 404 until a
        certificate has been uploaded.
      operationId: getSiteCert
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Site certificate metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteCert"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Upload/renew the cluster's own cert/key (as PEM text) and refresh Traefik
      description: |
        Cert and key arrive as PEM TEXT in the JSON body — never as a file upload.
        The pair is validated against the cluster's persisted domain, written as
        the local source of truth under ~/.pmcluster/config/site/, materialized as
        versioned Swarm secrets (cert_vN/key_vN), wired into the Traefik dynamic
        config, and its metadata recorded for expiry monitoring.
      operationId: putSiteCert
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cert, key]
              properties:
                cert:
                  type: string
                key:
                  type: string
      responses:
        "200":
          description: Uploaded and Traefik refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteCert"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/tls/hosts:
    get:
      summary: List per-host TLS certificates
      description: |
        Per-host certificates live in the SAME table and flow as the cluster's
        own certificate: the PEM bytes are versioned Swarm secrets
        (hostcert-<host>_vNNN / hostkey-<host>_vNNN) and this list returns the
        DB metadata for every row except the cluster's own domain (which is
        served by GET /api/tls/site). Nothing is ever read from the manager's
        filesystem.
      operationId: listHostCerts
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Host certificate list
          content:
            application/json:
              schema:
                type: object
                properties:
                  hosts:
                    type: array
                    items:
                      $ref: "#/components/schemas/HostCert"
  /api/tls/hosts/{host}:
    put:
      summary: Store a per-host cert/key (as PEM text) and refresh Traefik
      description: |
        Cert and key arrive as PEM TEXT in the JSON body — never as a file upload.
        Only reachable when per-host TLS is wired (HostCertService).
      operationId: putHostCert
      security:
        - bearerAuth: []
      parameters:
        - name: host
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cert, key]
              properties:
                cert:
                  type: string
                key:
                  type: string
      responses:
        "200":
          description: Stored (and Traefik refreshed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostCert"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          description: Stored but Traefik refresh failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Remove a per-host certificate
      operationId: removeHostCert
      security:
        - bearerAuth: []
      parameters:
        - name: host
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed
        "404":
          $ref: "#/components/responses/NotFound"
  /api/webhooks:
    get:
      summary: List webhook sources (without revealing secrets)
      operationId: listWebhooks
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Webhook source list
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhooks:
                    type: array
                    items:
                      $ref: "#/components/schemas/Webhook"
    post:
      summary: Create a webhoook source (shared secret returned once)
      description: The HMAC shared secret is generated on the daemon, stored encrypted,
        and returned in the response body ONCE. It can never be read again.
      operationId: createWebhook
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source]
              properties:
                source:
                  type: string
                description:
                  type: string
      responses:
        "201":
          description: Created. `secret` is returned once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Source already exists
  /api/webhooks/{source}:
    delete:
      summary: Revoke a webhook source
      operationId: deleteWebhook
      security:
        - bearerAuth: []
      parameters:
        - name: source
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Revoked (shared secret invalidated)
        "404":
          $ref: "#/components/responses/NotFound"
  /api/webhooks/{source}/deliveries:
    get:
      summary: List webhook delivery history for a source
      description: >-
        Newest-first delivery log (accepted, unauthorized, bad_request,
        server_error) for the given webhook source, with deploy provenance
        (stack, revision, repo, file) captured on successful deliveries.
      operationId: listWebhookDeliveries
      security:
        - bearerAuth: []
      parameters:
        - name: source
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        "200":
          description: Delivery list (newest first)
          content:
            application/json:
              schema:
                type: object
                properties:
                  deliveries:
                    type: array
                    items:
                      $ref: "#/components/schemas/WebhookDelivery"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/backups/{id}/files:
    get:
      summary: Browse a backup archive's contents
      description: >-
        Lists the files and directories inside a backup run's archive(s)
        without restoring anything. Archives are plain directories or
        tar/tar.gz files under the backup root.
      operationId: browseBackup
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Backup run + file listing
          content:
            application/json:
              schema:
                type: object
                properties:
                  run:
                    $ref: "#/components/schemas/Backup"
                  files:
                    type: array
                    items:
                      $ref: "#/components/schemas/BackupFile"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/backups/{id}/restore:
    post:
      summary: Restore a backup into the volume root
      description: >-
        Extracts every archive of a SUCCEEDED, stack-scoped backup run back
        under the destination root (default /var/stack/data/<stack>). Refuses
        non-succeeded runs and runs not tied to a stack.
      operationId: restoreBackup
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                dest_root:
                  type: string
                  default: /var/stack/data
      responses:
        "200":
          description: Restore result
          content:
            application/json:
              schema:
                type: object
                properties:
                  restored:
                    type: integer
                    description: Number of files restored
                  dest_root:
                    type: string
        "400":
          description: Run is not restorable (not succeeded or not stack-scoped)
  /api/cluster/settings:
    get:
      summary: Read cluster settings
      description: >-
        Returns all allowlisted cluster settings (volume_root,
        backup_all_nodes, sso_*, edge_login_disabled, domain, oo_admin_email,
        traefik_admin_user). Empty string means unset.
      operationId: getClusterSettings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Settings map
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings:
                    type: object
                    additionalProperties:
                      type: string
    put:
      summary: Update cluster settings
      description: >-
        Persists the given settings keys. Unknown keys are rejected (400) and
        the write is atomic. Does NOT redeploy — run `pmcluster cluster
        update` (or the console Apply) for changes to take effect.
      operationId: updateClusterSettings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings]
              properties:
                settings:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        "200":
          description: Updated settings map
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings:
                    type: object
                    additionalProperties:
                      type: string
        "400":
          description: Unknown or empty setting key
  /api/usage:
    get:
      summary: Secret and config usage graph
      description: >-
        Aggregates which deployed stacks reference which Docker configs and
        secrets, parsed from the latest revision's rendered compose for each
        stack.
      operationId: getUsage
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Usage map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usage"
  /api/api_keys:
    get:
      summary: List API users (without token material)
      operationId: listAPIKeys
      security:
        - bearerAuth: []
      responses:
        "200":
          description: API key list
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      $ref: "#/components/schemas/APIKey"
    post:
      summary: Create an API user (bearer token returned once)
      description: The bearer token is generated, hashed (argon2id) at rest, and
        returned in the response body ONCE. It can never be read again.
      operationId: createAPIKey
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "201":
          description: Created. `token` is returned once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: User already exists
  /api/api_keys/{id}:
    delete:
      summary: Remove an API user (revoke its bearer token)
      description: Deletes the user row; the bearer token stops working on the
        next request. Refuses to remove the "edge" user (required by the operator
        console) or the API key used to authenticate the request.
      operationId: deleteAPIKey
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: API user id (see GET /api/api_keys)
      responses:
        "204":
          description: Removed
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: API key not found
        "409":
          description: Refused — edge user or the key currently in use
  /api/secrets:
    get:
      summary: List secrets (metadata + sha256 hash, never the plaintext)
      operationId: listSecrets
      security:
        - bearerAuth: []
      parameters:
        - name: scope
          in: query
          required: false
          description: Filter by scope (cluster or service). Empty returns both.
          schema:
            type: string
        - name: stack
          in: query
          required: false
          description: Filter by owning stack (service-scope secrets). Empty returns all stacks.
          schema:
            type: string
      responses:
        "200":
          description: Secret metadata rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  secrets:
                    type: array
                    items:
                      $ref: "#/components/schemas/Secret"
    post:
      summary: Create a secret (value stored AES-GCM encrypted)
      operationId: createSecret
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, value]
              properties:
                name:
                  type: string
                scope:
                  type: string
                  enum: [cluster, service]
                  default: service
                stack:
                  type: string
                  description: Owning stack (only valid for service scope)
                value:
                  type: string
      responses:
        "201":
          description: Created — returns the id, scope, name and hash
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Secret"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: A secret with that name already exists
  /api/secrets/{name}:
    put:
      summary: Update a secret's value (keeps scope, stack and name)
      operationId: updateSecret
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  type: string
      responses:
        "200":
          description: Updated — returns name and new hash
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  hash:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Secret not found
    delete:
      summary: Delete a secret
      operationId: deleteSecret
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Secret not found
  /api/secrets/{name}/value:
    get:
      summary: Reveal a secret's plaintext value
      description: |
        Returns the decrypted plaintext value of a secret (operator-facing;
        used by the console Reveal button). Requires an operator/admin role.
      operationId: revealSecretValue
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Secret value
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  value:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Secret not found
  /api/configs:
    get:
      summary: List configs (metadata + hash, no content)
      operationId: listConfigs
      security:
        - bearerAuth: []
      parameters:
        - name: scope
          in: query
          required: false
          description: Filter by scope (cluster or service). Empty returns both.
          schema:
            type: string
        - name: stack
          in: query
          required: false
          description: Filter by owning stack (service-scope configs). Empty returns all stacks.
          schema:
            type: string
      responses:
        "200":
          description: Config metadata rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  configs:
                    type: array
                    items:
                      $ref: "#/components/schemas/Config"
    post:
      summary: Create a config
      operationId: createConfig
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, content]
              properties:
                name:
                  type: string
                scope:
                  type: string
                  enum: [cluster, service]
                  default: service
                stack:
                  type: string
                  description: Owning stack (only valid for service scope)
                kind:
                  type: string
                  enum: [template, file, env]
                  default: file
                content:
                  type: string
      responses:
        "201":
          description: Created — returns metadata incl. hash
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: A config with that name already exists
  /api/update:
    post:
      summary: Trigger a content-aware cluster update (re-applies the platform stacks)
      operationId: triggerUpdate
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Update summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  otel_config:
                    type: string
                  traefik_config:
                    type: string
                  cert_secret:
                    type: string
                  key_secret:
                    type: string
                  edge_config:
                    type: string
                  stacks_deployed:
                    type: array
                    items:
                      type: string
        "500":
          description: Cluster update failed
  /api/cluster/rendered:
    get:
      summary: Stored rendered platform configs (post-substitution YAML sent to the Swarm, snapshotted into the database by every cluster update, read-only)
      operationId: listRenderedConfigs
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Rendered configs
          content:
            application/json:
              schema:
                type: object
                properties:
                  configs:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        content:
                          type: string
        "500":
          description: Render failed
  /api/configs/{name}:
    get:
      summary: Get a config including its content
      operationId: getConfig
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Config with content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Update a config's content (previous value is kept in history)
      operationId: updateConfig
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
      responses:
        "200":
          description: Updated — returns name + new hash
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  hash:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete a config (versions are cascaded away)
      operationId: deleteConfig
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /api/configs/{name}/versions:
    get:
      summary: List a config's version history (newest first)
      operationId: listConfigVersions
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Version history
          content:
            application/json:
              schema:
                type: object
                properties:
                  versions:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConfigVersion"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/configs/{name}/rollback:
    post:
      summary: Restore a config to a previous version
      operationId: rollbackConfig
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version_id]
              properties:
                version_id:
                  type: integer
                  format: int64
      responses:
        "200":
          description: Rolled back — returns name, new hash, and the version id
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  hash:
                    type: string
                  rolled_back_to:
                    type: integer
                    format: int64
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Config or version not found
  /api/services:
    get:
      summary: List every swarm service with live replica health
      operationId: listServices
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All services across all stacks
          content:
            application/json:
              schema:
                type: object
                properties:
                  services:
                    type: array
                    items:
                      $ref: "#/components/schemas/Service"
  /api/services/{stack}:
    get:
      summary: List one stack's services
      operationId: listStackServices
      security:
        - bearerAuth: []
      parameters:
        - name: stack
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Services belonging to the stack
          content:
            application/json:
              schema:
                type: object
                properties:
                  services:
                    type: array
                    items:
                      $ref: "#/components/schemas/Service"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/services/{stack}/{service}/tasks:
    get:
      summary: Task (replica) history for a service — crash/restart visibility
      operationId: serviceTasks
      security:
        - bearerAuth: []
      parameters:
        - name: stack
          in: path
          required: true
          schema:
            type: string
        - name: service
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Task rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/ServiceTask"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Service not found or does not belong to the stack
  /api/services/{stack}/{service}/logs:
    get:
      summary: Tail a service's stdout/stderr
      operationId: serviceLogs
      security:
        - bearerAuth: []
      parameters:
        - name: stack
          in: path
          required: true
          schema:
            type: string
        - name: service
          in: path
          required: true
          schema:
            type: string
        - name: tail
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 2000
            default: 200
      responses:
        "200":
          description: Interleaved log lines
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                  logs:
                    type: array
                    items:
                      $ref: "#/components/schemas/ServiceLogLine"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Service not found or does not belong to the stack
  /api/services/{stack}/{service}/restart:
    post:
      summary: Force a rolling restart of a service (whitelisted, no raw Docker passthrough)
      operationId: restartService
      security:
        - bearerAuth: []
      parameters:
        - name: stack
          in: path
          required: true
          schema:
            type: string
        - name: service
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Restart triggered
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                  restarted:
                    type: boolean
                    const: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Service not found or does not belong to the stack
  /api/services/{stack}/{service}/exec:
    post:
      summary: Run a non-interactive command in a running task of the service
      operationId: execService
      security:
        - bearerAuth: []
      parameters:
        - name: stack
          in: path
          required: true
          schema:
            type: string
        - name: service
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [argv]
              properties:
                argv:
                  type: array
                  items:
                    type: string
                    maxLength: 200
                  minItems: 1
                  maxItems: 16
      responses:
        "200":
          description: Command output + exit code (exec runs on the daemon's node only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Service not found, does not belong to the stack, or no task on this node
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: pmc_<token_id>_<secret>
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
    Health:
      type: object
      properties:
        status:
          type: string
        version:
          type: string
        commit:
          type: string
    Me:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    DeployPayload:
      type: object
      properties:
        app_name:
          type: string
        repo_url:
          type: string
        version:
          type: string
        manifest:
          type: string
      required:
        - manifest
    DeployResult:
      type: object
      properties:
        stack:
          type: string
        revision:
          type: integer
          format: int64
    RollbackResult:
      type: object
      properties:
        stack:
          type: string
        new_revision:
          type: integer
          format: int64
        rolled_back_to:
          type: integer
          format: int64
    SyncResult:
      type: object
      properties:
        stack:
          type: string
        revision:
          type: integer
          format: int64
        changed:
          type: boolean
          description: false when the re-render matched the stored rendered_hash (no-op)
    WebhookDelivery:
      type: object
      properties:
        id:
          type: integer
          format: int64
        source:
          type: string
        status:
          type: string
          enum: [accepted, unauthorized, bad_request, server_error]
        stack_name:
          type: string
        revision:
          type: integer
          format: int64
        repo_url:
          type: string
        file:
          type: string
        error:
          type: string
        created_at:
          type: integer
          format: int64
    BackupFile:
      type: object
      properties:
        path:
          type: string
        size:
          type: integer
          format: int64
          description: -1 when the archive path is missing on disk
        is_dir:
          type: boolean
    Usage:
      type: object
      properties:
        configs:
          type: object
          description: Docker config name -> stacks referencing it
          additionalProperties:
            type: array
            items:
              type: string
        secrets:
          type: object
          description: Swarm secret name -> stacks referencing it
          additionalProperties:
            type: array
            items:
              type: string
    ClusterInfo:
      type: object
      properties:
        node_name:
          type: string
        server_version:
          type: string
        os:
          type: string
        arch:
          type: string
        cpus:
          type: integer
        memory_bytes:
          type: integer
          format: int64
        swarm:
          $ref: "#/components/schemas/SwarmInfo"
    SwarmInfo:
      type: object
      properties:
        state:
          type: string
        control_available:
          type: boolean
        managers:
          type: integer
        nodes:
          type: integer
    Node:
      type: object
      properties:
        id:
          type: string
        hostname:
          type: string
        role:
          type: string
        availability:
          type: string
        status:
          type: string
        is_leader:
          type: boolean
        engine_version:
          type: string
        address:
          type: string
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64
    Stack:
      type: object
      properties:
        name:
          type: string
        current_revision:
          type: integer
          format: int64
        repo_url:
          type: string
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64
    StackDetail:
      type: object
      properties:
        stack:
          $ref: "#/components/schemas/Stack"
        revisions:
          type: array
          items:
            type: object
            properties:
              revision:
                type: integer
                format: int64
              created_at:
                type: integer
                format: int64
        last_backup:
          $ref: "#/components/schemas/BackupSummary"
    BackupSummary:
      type: object
      properties:
        status:
          type: string
        started_at:
          type: integer
          format: int64
        finished_at:
          type: integer
          format: int64
        revision:
          type: integer
          format: int64
        error_message:
          type: string
    Revision:
      type: object
      properties:
        stack:
          type: string
        revision:
          type: integer
          format: int64
        created_at:
          type: integer
          format: int64
        source_yaml:
          type: string
        rendered_yaml:
          type: string
        payload:
          type: string
    Backup:
      type: object
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
        stack_name:
          type: string
        revision:
          type: integer
          format: int64
        archive_paths:
          type: array
          items:
            type: string
        error_message:
          type: string
        started_at:
          type: integer
          format: int64
        finished_at:
          type: integer
          format: int64
    HostCert:
      type: object
      properties:
        host:
          type: string
        sans:
          type: array
          items:
            type: string
        not_after:
          type: string
          format: date-time
        not_before:
          type: string
          format: date-time
        cert_secret:
          type: string
        key_secret:
          type: string
        cert_hash:
          type: string
        key_hash:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SiteCert:
      type: object
      properties:
        domain:
          type: string
        cert_secret:
          type: string
        key_secret:
          type: string
        not_before:
          type: string
          format: date-time
        not_after:
          type: string
          format: date-time
        sans:
          type: array
          items:
            type: string
        cert_hash:
          type: string
        key_hash:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Webhook:
      type: object
      properties:
        source:
          type: string
        description:
          type: string
        created_at:
          type: integer
          format: int64
        last_used_at:
          type: integer
          format: int64
    WebhookCreated:
      type: object
      properties:
        source:
          type: string
        secret:
          type: string
    APIKey:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        created_at:
          type: integer
          format: int64
    APIKeyCreated:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        token:
          type: string
    Secret:
      type: object
      properties:
        id:
          type: integer
          format: int64
        scope:
          type: string
          enum: [cluster, service]
        stack:
          type: string
          description: owning stack (service scope only); empty for cluster scope
        name:
          type: string
        hash:
          type: string
          description: sha256 hex fingerprint of the plaintext value
        created_at:
          type: integer
          format: int64
    Config:
      type: object
      properties:
        id:
          type: integer
          format: int64
        scope:
          type: string
          enum: [cluster, service]
        stack:
          type: string
          description: owning stack (service scope only); empty for cluster scope
        name:
          type: string
        kind:
          type: string
          enum: [template, file, env]
        version:
          type: string
          description: last writing build version
        hash:
          type: string
        content:
          type: string
          description: only present on get (single config); omitted on list
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64
    ConfigVersion:
      type: object
      properties:
        id:
          type: integer
          format: int64
        hash:
          type: string
        created_at:
          type: integer
          format: int64
    Service:
      type: object
      properties:
        name:
          type: string
          description: full swarm service name (stack_service)
        stack:
          type: string
          description: stack namespace from the com.docker.stack.namespace label; empty for unstacked services
        replicas:
          type: integer
          format: int64
          description: currently running tasks
        desired:
          type: integer
          format: int64
          description: desired replicas (global services report running tasks)
        image:
          type: string
        mode:
          type: string
          enum: [replicated, global]
        updated:
          type: integer
          format: int64
          description: last service spec update (unix seconds)
    ServiceTask:
      type: object
      properties:
        task_id:
          type: string
        node:
          type: string
          description: swarm node hostname running the task
        slot:
          type: integer
          format: int64
        state:
          type: string
          description: swarm task state (running, failed, rejected, shutdown, ...)
        error:
          type: string
          description: task error message, when failed/rejected
        started_at:
          type: integer
          format: int64
        finished_at:
          type: integer
          format: int64
    ServiceLogLine:
      type: object
      properties:
        stream:
          type: string
          enum: [stdout, stderr]
        line:
          type: string
    ExecResult:
      type: object
      properties:
        service:
          type: string
        exit_code:
          type: integer
        stdout:
          type: string
        stderr:
          type: string
