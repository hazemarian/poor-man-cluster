                    type: string
                  hash:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete a config (versions are cascaded away)
      operationId: deleteConfig
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
