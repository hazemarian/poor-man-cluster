# docker must not start without the app-data mount.
#
# Without this, a boot where pmcluster-data-loop.service failed leaves
# /var/stack/data as an ordinary directory on the root filesystem, docker comes
# up regardless, and every stack's bind mount silently points at an empty
# directory. RequiresMountsFor adds Requires= and After= on var-stack-data.mount:
# no mount, no docker, and the node stays out of service with a visible failed
# unit instead of serving blank databases.
[Unit]
RequiresMountsFor=/var/stack/data
