# systemd drop-in for docker.service — OPT-IN, read before installing.
#
# Install at /etc/systemd/system/docker.service.d/20-pmcluster-private-ports.conf
# ONLY after /etc/pmcluster/private-ports.nft exists and `nft -c -f` accepts it.
# This drop-in makes docker require that unit, so a ruleset that fails to load
# stops the Docker daemon from starting — which stops the whole cluster. That is
# deliberate for a firewall (fail closed), and it is why the install is a
# documented step rather than something pmcluster does for you.
[Unit]
Requires=pmcluster-private-ports.service
After=pmcluster-private-ports.service
